name: "Build the app image"
description: >-
  Builds dockerfiles/PragmaticPapers.ci.Dockerfile once, for E2E to test and the
  PR preview to deploy (#1090). Nothing environment-specific is built in: the
  server reads SERVER_URL and the rest at runtime. Saves the image as the
  `app-image` artifact, and pushes it to GHCR when `push-tag` is set.
  The calling job must run on the bare runner (not in a container), with a
  Postgres service on localhost:5432 whose database is `build`: `next build`
  prerenders from it.

inputs:
  gh-font-read-token:
    description: "GitHub token for the private font package"
    required: true
  source-commit:
    description: "The commit the image is built from (Sentry release, image label)"
    required: true
  push-tag:
    description: "Full image reference to push to GHCR, e.g. ghcr.io/org/repo:tag. Empty: don't push."
    required: false
    default: ""
  registry-token:
    description: "Token that can write packages; required with push-tag"
    required: false
    default: ""

outputs:
  image:
    description: "The local image reference inside the artifact"
    value: pragmatic-papers-app:ci

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v4
      with:
        # The build reaches the Postgres service on the runner's network. BuildKit runs
        # in its own container, so that container needs the host's network too: without
        # network=host, the build's `network: host` is the container's, and
        # 127.0.0.1:5432 refuses.
        driver-opts: network=host
        buildkitd-flags: --allow-insecure-entitlement network.host

    # Written as a tar for the artifact rather than pushed: fork, Dependabot and
    # merge-queue runs can't push to GHCR, and E2E runs on every one of them.
    - name: Build
      uses: docker/build-push-action@v7
      env:
        GH_FONT_READ: ${{ inputs.gh-font-read-token }}
      with:
        context: .
        file: dockerfiles/PragmaticPapers.ci.Dockerfile
        outputs: type=docker,dest=${{ runner.temp }}/app-image.tar
        tags: |
          pragmatic-papers-app:ci
          ${{ inputs.push-tag }}
        network: host
        allow: network.host
        secret-envs: GH_FONT_READ=GH_FONT_READ
        # No SERVER_URL or COOLIFY_FQDN: they're read at runtime, so one image serves
        # E2E on localhost and the preview on its own host.
        build-args: |
          DATABASE_URI=postgres://postgres:postgres@127.0.0.1:5432/build
          SOURCE_COMMIT=${{ inputs.source-commit }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ inputs.source-commit }}
        # The dependency layers only change with the lockfile; everything from
        # `COPY . .` on rebuilds each time anyway.
        cache-from: type=gha,scope=app-image
        cache-to: type=gha,scope=app-image,mode=max

    - name: Save the image for later jobs
      uses: actions/upload-artifact@v7
      with:
        name: app-image
        path: ${{ runner.temp }}/app-image.tar
        retention-days: 1

    - name: Log in to GHCR
      if: inputs.push-tag != ''
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.registry-token }}

    - name: Push to GHCR
      if: inputs.push-tag != ''
      shell: bash
      env:
        TAG: ${{ inputs.push-tag }}
      run: |
        docker load -i "$RUNNER_TEMP/app-image.tar"
        docker push "$TAG"
