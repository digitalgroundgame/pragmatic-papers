name: "Build the app image"
description: >-
  Builds dockerfiles/PragmaticPapers.ci.Dockerfile once, for E2E to test and the
  PR preview to deploy. Nothing environment-specific is built in: the
  server reads SERVER_URL and the rest at runtime. Saves the image as the
  `app-image` artifact, and pushes it to GHCR when `push-tag` is set.
  The calling job must run on the bare runner (not in a container), with a
  Postgres service on localhost:5432 whose database is `build`: `next build`
  prerenders from it.

inputs:
  gh-font-read-token:
    description: "GitHub token for the private font package"
    required: true
  source-commit:
    description: "The commit the image is built from (Sentry release, image label)"
    required: true
  push-tag:
    description: "Full image reference to push to GHCR, e.g. ghcr.io/org/repo:tag. Empty: don't push."
    required: false
    default: ""
  registry-token:
    description: "Token that can write packages; required with push-tag"
    required: false
    default: ""
  save-cache:
    description: >-
      "true" to write the layer cache back to GitHub's cache. Exporting it takes
      one to two and a half minutes, so only pushes (to dev and main) save it; PRs
      and the merge queue read dev's entry, which every branch can, being the
      default branch's.
    required: false
    default: "false"

outputs:
  image:
    description: "The local image reference inside the artifact"
    value: pragmatic-papers-app:ci

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v4
      with:
        # The build reaches the Postgres service on the runner's network. BuildKit runs
        # in its own container, so that container needs the host's network too: without
        # network=host, the build's `network: host` is the container's, and
        # 127.0.0.1:5432 refuses. BuildKit's own image comes through Google's Docker Hub
        # mirror: Docker Hub rate-limits anonymous pulls, and shared runners run out.
        driver-opts: |
          network=host
          image=mirror.gcr.io/moby/buildkit:buildx-stable-1
        buildkitd-flags: --allow-insecure-entitlement network.host
        # The runner is thrown away after the job, so skip removing the builder, which
        # took ~40 s at the end of every run, ahead of the jobs waiting on the image.
        cleanup: false

    # The pnpm version, for the base stage's corepack. Passed as a build arg rather
    # than read from a bind-mounted package.json there, because a bind mount's
    # contents are part of the layer's cache key: any edit to package.json, a
    # script included, would rebuild every dependency layer after it.
    - name: Read the package manager
      id: package-manager
      shell: bash
      run: echo "value=$(jq -r .packageManager package.json)" >> "$GITHUB_OUTPUT"

    # The Node base image from ci-images.yml's GHCR copy, pulled logged in: ECR Public
    # throttles logged-out pulls per IP, and shared runners run out ("429 Too Many
    # Requests: Data limit exceeded"). Until that copy has this NODE_VERSION (a bump
    # publishes it once it reaches dev), or when the login fails, it's Google's Docker
    # Hub mirror, which BuildKit's own image comes through too, and ECR Public only when
    # neither has the tag. BuildKit reads the login from the runner's Docker config.
    - name: Log in to GHCR
      id: ghcr-login
      continue-on-error: true
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.registry-token || github.token }}

    - name: Choose the Node base image
      id: node-registry
      shell: bash
      env:
        LOGGED_IN: ${{ steps.ghcr-login.outcome == 'success' }}
        MIRROR: ghcr.io/digitalgroundgame
      run: |
        version=$(sed -n 's/^ARG NODE_VERSION=//p' dockerfiles/PragmaticPapers.ci.Dockerfile)
        has() { [ -n "$version" ] && docker buildx imagetools inspect "$1/node:${version}-alpine" > /dev/null; }
        if [ "$LOGGED_IN" = true ] && has "$MIRROR"; then
          registry=$MIRROR
        else
          echo "::warning::No GHCR copy of node:${version}-alpine to pull. Run the CI images workflow to publish it."
          if has mirror.gcr.io/library; then
            registry=mirror.gcr.io/library
          else
            registry=public.ecr.aws/docker/library
          fi
        fi
        echo "Building on $registry/node:${version}-alpine"
        echo "value=$registry" >> "$GITHUB_OUTPUT"

    # Written as a tar for the artifact rather than pushed: fork, Dependabot and
    # merge-queue runs can't push to GHCR, and E2E runs on every one of them.
    - name: Build
      uses: docker/build-push-action@v7
      env:
        GH_FONT_READ: ${{ inputs.gh-font-read-token }}
      with:
        context: .
        file: dockerfiles/PragmaticPapers.ci.Dockerfile
        outputs: type=docker,dest=${{ runner.temp }}/app-image.tar
        tags: |
          pragmatic-papers-app:ci
          ${{ inputs.push-tag }}
        network: host
        allow: network.host
        secret-envs: GH_FONT_READ=GH_FONT_READ
        # No SERVER_URL or COOLIFY_FQDN: they're read at runtime, so one image serves
        # E2E on localhost and the preview on its own host.
        build-args: |
          DATABASE_URI=postgres://postgres:postgres@127.0.0.1:5432/build
          SOURCE_COMMIT=${{ inputs.source-commit }}
          PACKAGE_MANAGER=${{ steps.package-manager.outputs.value }}
          NODE_REGISTRY=${{ steps.node-registry.outputs.value }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ inputs.source-commit }}
        # The dependency layers only change with the lockfile; everything from
        # `COPY . .` on rebuilds each time anyway.
        cache-from: type=gha,scope=app-image
        cache-to: ${{ inputs.save-cache == 'true' && 'type=gha,scope=app-image,mode=max' || '' }}

    - name: Save the image for later jobs
      uses: actions/upload-artifact@v7
      with:
        name: app-image
        path: ${{ runner.temp }}/app-image.tar
        retention-days: 1

    # Logged in by the first GHCR step, with registry-token.
    - name: Push to GHCR
      if: inputs.push-tag != ''
      shell: bash
      env:
        TAG: ${{ inputs.push-tag }}
      run: |
        docker load -i "$RUNNER_TEMP/app-image.tar"
        docker push "$TAG"
