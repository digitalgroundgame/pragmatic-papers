name: "Download dev's artifact"
description: >-
  Downloads an artifact from the newest run of this workflow on a push to dev
  that has it, as the baseline a PR's report compares with. Looks back over the
  last 10 completed runs, since a run whose other jobs failed may still have
  uploaded it. Outputs an empty `dir` when none has it. Needs `actions: read`.

inputs:
  name:
    description: "The artifact's name"
    required: true

outputs:
  dir:
    description: "Where the artifact was extracted, or empty"
    value: ${{ steps.download.outputs.dir }}

runs:
  using: composite
  steps:
    - id: download
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        NAME: ${{ inputs.name }}
        WORKFLOW: ${{ github.workflow_ref }}
      run: |
        # owner/repo/.github/workflows/file.yml@ref → file.yml
        file="${WORKFLOW%@*}"
        file="${file##*/}"
        dir="$RUNNER_TEMP/dev-$NAME"
        for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$file/runs?branch=dev&event=push&status=completed&per_page=10" --jq '.workflow_runs[].id'); do
          if gh run download "$run" --name "$NAME" --dir "$dir" --repo "$GITHUB_REPOSITORY" 2>/dev/null; then
            echo "Comparing with dev's run $run."
            echo "dir=$dir" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        done
        echo "::notice::No run on dev has the $NAME artifact yet; reporting without a comparison."
