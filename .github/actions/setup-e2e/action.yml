name: "Set up E2E"
description: >-
  Shared setup for the E2E jobs in playwright.yml and update-snapshots.yml:
  the E2E environment, the GitHub CLI, dependencies and the Next.js build
  cache. Runs inside the pinned Playwright image, after actions/checkout.

inputs:
  gh-font-read-token:
    description: "GitHub Token for private font packages"
    required: true
  save-pnpm-cache:
    description: "Passed to setup-project"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # Both workflows render and commit baselines, so they must render the same
    # page: a variable set in one and not the other rewrites every baseline it
    # touches. Written to $GITHUB_ENV, so it reaches every later step of the
    # calling job, including pnpm install below.
    - name: Set the E2E environment
      shell: bash
      run: |
        cat >> "$GITHUB_ENV" << 'EOF'
        PAYLOAD_SECRET=e2e-payload-secret
        NEXT_PUBLIC_SERVER_URL=http://localhost:8000
        USE_LOCAL_STORAGE=true
        MERCH_SITE_URL=https://digitalgroundgame.org/merch
        DATABASE_URI=postgres://postgres:postgres@postgres:5432/pragmatic-papers-e2e
        E2E_PROD_SERVER=true
        FONTS_REQUIRED=true
        EOF
      # MERCH_SITE_URL: the Merch block has no built-in store site. Without it
      # the block renders nothing, merch.spec.ts has no carousel to exercise,
      # and every baseline that shares a page with it is rendered without it.
      #
      # DATABASE_URI: the host is the job's `postgres` service key, not
      # localhost. The job runs inside a container, and service containers are
      # reachable by their service-id alias on the shared Docker network. The
      # database name must match the service's POSTGRES_DB.
      #
      # FONTS_REQUIRED: refuse to render with the Inter fallback.
      # scripts/install-fonts.ts silently substitutes Inter when
      # @digitalgroundgame/fonts can't be fetched, which turns a broken
      # GH_FONT_READ into a whole-suite "visual regression" whose PR comment
      # invites you to commit Inter-rendered baselines. The pnpm store cache
      # hides the breakage on dev: an unchanged lockfile means `reused N,
      # downloaded 0`, so the token is never exercised until a PR touches the
      # lockfile. Failing at install turns that into one legible error.

    # actions/checkout's files are owned by a different UID than this
    # container's user, so git's dubious-ownership check blocks every git
    # command unless the workspace is explicitly trusted.
    - name: Trust the checked-out workspace
      shell: bash
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    # The Playwright image doesn't ship the GitHub CLI, but both workflows
    # commit baselines and post PR comments with `gh`. Pull the release tarball
    # straight from GitHub instead of going through the apt repo, which ran
    # `apt-get update` twice (~20-40s) just to land one static binary. The
    # pinned version only needs to be recent enough for the `gh api`/`gh run`/
    # `gh pr` commands used; bump freely.
    - name: Install GitHub CLI
      shell: bash
      run: |
        GH_VERSION=2.63.2
        ARCH=$(dpkg --print-architecture)
        curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_${ARCH}.tar.gz" \
          | tar -xz -C /tmp
        install "/tmp/gh_${GH_VERSION}_linux_${ARCH}/bin/gh" /usr/local/bin/gh
        gh --version

    - name: Set up Node.js environment
      uses: ./.github/actions/setup-project
      with:
        node-version: "24.x"
        gh-font-read-token: ${{ inputs.gh-font-read-token }}
        payload-secret: e2e-payload-secret
        save-pnpm-cache: ${{ inputs.save-pnpm-cache }}

    # Restores Next.js incremental compilation cache so `next build` inside
    # the E2E run only recompiles what changed since the last run on this
    # exact source tree. No `restore-keys` fallback: a partial (prefix) match
    # restores whatever `.next/cache` a DIFFERENT source tree last saved under
    # the same lockfile hash, and Next's incremental build doesn't reliably
    # notice that a plain data import (e.g. a fixture JSON bundled into the
    # seed) changed underneath it. It can silently keep serving output baked
    # from that other tree instead of rebuilding. An exact-key-only cache
    # still speeds up a re-run of unchanged source; anything that actually
    # changed gets a real (if slower) clean build instead of a wrong one.
    - name: Cache Next.js build cache
      uses: actions/cache@v6
      with:
        path: .next/cache
        key: nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx', 'src/**/*.json', '*.[jt]s', '*.[jt]sx') }}
