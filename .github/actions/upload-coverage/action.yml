name: "Upload coverage"
description: >-
  Uploads a coverage-final.json for the Coverage job. Coverage names files by
  absolute path, which differs between a container job and a bare runner, so
  the workspace is swapped for a placeholder the Coverage job puts back.

inputs:
  name:
    description: Artifact name (the Coverage job downloads `coverage-final-*`)
    required: true
  path:
    description: Path to the coverage-final.json
    required: true

runs:
  using: composite
  steps:
    - name: Replace the workspace path
      shell: bash
      run: sed -i "s#${GITHUB_WORKSPACE}/#/__COVERAGE_ROOT__/#g" "$COVERAGE"
      env:
        COVERAGE: ${{ inputs.path }}

    - uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: 1
