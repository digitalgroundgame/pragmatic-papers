# Label taxonomy for digitalgroundgame/pragmatic-papers — the source of truth.
#
# Synced to GitHub by .github/workflows/labels.yml (crazy-max/ghaction-github-labeler)
# on push to `dev`. To add, rename, recolor, or remove a label, edit this file in a
# PR — do NOT change labels in the GitHub UI, the next sync would revert it.
#
# `color` is a 6-digit hex WITHOUT the leading '#', quoted so all-digit values
# (e.g. "168700") are read as strings, not numbers.
#
# NOTE: issue *types* (Bug / Feature / Task) are org-level metadata, NOT labels,
# and cannot be managed here. See .claude/skills/github-issues/SKILL.md.

- name: "blocked"
  color: "B60205"
  description: ""
- name: "ci"
  color: "1D76DB"
  description: "CI, build, and deployment pipeline work"
- name: "dependencies"
  color: "0366d6"
  description: "Pull requests that update a dependency file"
- name: "discussion"
  color: "aaaaaa"
  description: ""
- name: "documentation"
  color: "0075ca"
  description: "Improvements or additions to documentation"
- name: "duplicate"
  color: "cfd3d7"
  description: "This issue or pull request already exists"
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"
- name: "in progress"
  color: "fbca04"
  description: "The pull request is currently in progress"
# Renamed from "ready for review". `from_name` makes the sync rename the label in
# place, so PRs that carry it keep it; drop it once the sync has run on `dev`.
- name: "in review"
  from_name: "ready for review"
  color: "D77757"
  description: "Adding this label starts a Claude review of the pull request"
- name: "invalid"
  color: "e4e669"
  description: "This doesn't seem right"
- name: "needs screenshots"
  color: "bbbbe5"
  description: "Triggers screenshot baseline updates"
- name: "performance"
  color: "C2E0C6"
  description: "Performance and efficiency improvements"
- name: "question"
  color: "d876e3"
  description: "Further information is requested"
- name: "reference"
  color: "D3D3D3"
  description: "A PR saved for future reference and is not gonna be merged"
- name: "review comments"
  color: "006b75"
  description: "The pull request has comments that need reviewing"
- name: "security"
  color: "D93F0B"
  description: "Security fixes and vulnerability remediation"
- name: "stale"
  color: "B97B7C"
  description: "hasn't been worked on in 1+ month"
- name: "testing"
  color: "5319E7"
  description: "Adding or changing automated tests"
- name: "waiting on design"
  color: "3e4fd8"
  description: "This issue is backlogged until designed"
- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"
