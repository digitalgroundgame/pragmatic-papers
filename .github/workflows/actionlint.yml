name: Lint workflows

# actionlint type-checks workflow syntax and expressions, flags untrusted
# `${{ }}` input in scripts, and runs shellcheck over every `run:` block.
# Path-filtered, so keep it out of required checks (a skipped required check
# blocks merging).

on:
  pull_request:
    paths: [".github/workflows/**", ".github/actionlint.yaml"]
  push:
    branches: [dev]
    paths: [".github/workflows/**", ".github/actionlint.yaml"]

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The image bundles shellcheck, so run: blocks are checked too.
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
