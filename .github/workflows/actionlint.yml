name: Lint workflows

# actionlint type-checks workflow syntax and expressions, flags untrusted
# `${{ }}` input in scripts, and runs shellcheck over every `run:` block.
# Path-filtered, so keep it out of required checks (a skipped required check
# blocks merging).

on:
  pull_request:
    paths: [".github/workflows/**", ".github/actionlint.yaml"]
  push:
    branches: [dev]
    paths: [".github/workflows/**", ".github/actionlint.yaml"]

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The release binary rather than the rhysd/actionlint image: Docker Hub
      # rate-limits anonymous pulls, and GitHub's shared runners run out.
      # actionlint finds the runner's preinstalled shellcheck, so run: blocks
      # are still checked.
      - name: Install actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${archive}"
          echo "$SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint

      - name: Lint workflows
        run: |
          command -v shellcheck
          "$RUNNER_TEMP/actionlint" -color
