name: Assign linked issues

# When a PR that closes an issue (`Fixes #n`) is opened or edited, assign the PR
# author to that issue if nobody owns it yet. Catches work that started without
# the assignee step in .claude/skills/github-issues/SKILL.md. Closing keywords
# only link issues on PRs into the default branch, so stacked PRs aren't covered.
#
# pull_request_target so fork PRs get a token that can write issues. Safe
# because the job never checks out or runs PR code. GitHub silently ignores an
# assignee it won't accept (no repo access, never commented on the issue), so
# the response is checked. Dispatch with a PR number to re-run it by hand.

on:
  pull_request_target:
    types: [opened, reopened, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number whose linked issues to assign"
        required: true
        type: number

permissions:
  issues: write
  pull-requests: read

jobs:
  assign:
    name: Assign PR author to unassigned linked issues
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Assign
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          if [ -z "$AUTHOR" ]; then
            AUTHOR=$(gh api "repos/$REPO/pulls/$PR" --jq .user.login)
          fi
          # shellcheck disable=SC2016 # $owner/$name/$pr are GraphQL variables
          issues=$(gh api graphql \
            -f query='query($owner:String!,$name:String!,$pr:Int!){
              repository(owner:$owner,name:$name){ pullRequest(number:$pr){
                closingIssuesReferences(first:20){ nodes {
                  number repository { nameWithOwner } assignees(first:1){ totalCount } } } } } }' \
            -f owner="${REPO%/*}" -f name="${REPO#*/}" -F pr="$PR" \
            --jq ".data.repository.pullRequest.closingIssuesReferences.nodes[]
              | select(.repository.nameWithOwner == \"$REPO\" and .assignees.totalCount == 0)
              | .number")
          for n in $issues; do
            assigned=$(gh api -X POST "repos/$REPO/issues/$n/assignees" -f "assignees[]=$AUTHOR" \
              --jq "[.assignees[].login] | index(\"$AUTHOR\") != null")
            if [ "$assigned" = true ]; then
              echo "Assigned @$AUTHOR to #$n" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "Could not assign @$AUTHOR to #$n (GitHub ignored the assignee)" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done
