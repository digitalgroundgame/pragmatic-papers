# DISABLED — kept for reference, intentionally does not run.
#
# This workflow tried to auto-open the back-merge PR (main → dev) after a
# hotfix/* branch merged to main. It cannot work with the default GITHUB_TOKEN:
# opening a PR fails with "GitHub Actions is not permitted to create or approve
# pull requests". Back-merge PR creation now lives in the local hotfix script,
# which runs with the operator's gh credentials and forces a merge commit so dev
# and main never diverge:
#
#   pnpm hotfix <version> --phase 1   # branch off main, bump, PR → main (CI + review)
#   pnpm hotfix <version> --phase 2   # back-merge main → dev, merge-commit auto-merge
#
# To re-enable this workflow instead, supply a PAT / GitHub App token for the
# `gh pr create` step (and enable "Allow GitHub Actions to create and approve
# pull requests" in repo settings), then remove the `if: false` guard below.
name: "Auto Back-merge Hotfix to Dev"

on:
  workflow_dispatch:

jobs:
  back-merge:
    # Original intent: github.event.pull_request.merged == true &&
    #   startsWith(github.event.pull_request.head.ref, 'hotfix/')
    if: false # disabled — see note at top of file
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Back-merge PR
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_BRANCH: "chore/back-merge-${{ github.event.pull_request.head.ref }}"
        run: |
          # 1. Setup git identity
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 2. Create the new chore branch from main (to get the latest hotfix + tags)
          git checkout main
          git checkout -b "$NEW_BRANCH"

          # 3. Push the new branch to origin
          git push origin "$NEW_BRANCH"

          # 4. Create the PR body following the template
          PR_BODY=$(cat <<EOF
          Automated back-merge of hotfix merged into main.

          **If there are conflicts with the existing PRs in dev, follow these steps to resolve:**

          \`\`\`bash
          # 1. Sync your local
          git fetch origin

          # 2. Checkout this back-merge branch
          git checkout $NEW_BRANCH

          # 3. Pull the latest dev to resolve conflicts locally
          git pull origin dev

          # 4. Resolve & Push
          git add .
          git commit -m "chore: resolve conflicts with dev"
          git push origin $NEW_BRANCH
          \`\`\`
          EOF
          )

          # 5. Create the PR to dev
          gh pr create \
            --base dev \
            --head "$NEW_BRANCH" \
            --title "chore: back-merge ${{ github.event.pull_request.head.ref }} to dev" \
            --body "$PR_BODY"
