name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Cancel superseded runs on a PR so a new push doesn't leave the previous
# commit's Static/Unit/Integration jobs (two Postgres services + Testcontainers)
# running to completion for nothing. Scoped per-ref. Pushes to main/dev use a
# per-run group (github.run_id) so they never cancel each other — every commit
# landing on a protected branch is still validated in full.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which path-sensitive jobs below a PR needs. Only PRs are filtered:
  # on pushes to main/dev this job does nothing, and the jobs gated on it run
  # in full. A job skipped by its `if` reports "skipped", which a required
  # status check accepts, so gating a required job here never blocks a PR.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      storybook: ${{ steps.filter.outputs.storybook }}

    steps:
      # On pull_request the filter lists changed files through the API, so
      # no checkout is needed.
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          # A skip-list, not an allow-list: stories import from all over src/,
          # and the Storybook build exists to catch a server-only module
          # reaching the browser, which a change anywhere in src/ can cause.
          # So everything counts except paths no story or the Storybook build
          # can reach. When in doubt, leave a path out of this list.
          filters: |
            storybook:
              - "**"
              - "!**/*.md"
              - "!.claude/**"
              - "!tests/**"
              - "!src/migrations/**"
              - "!.github/*"
              - "!.github/workflows/!(ci).yml"
              - "!dockerfiles/**"
              - "!docker-compose*.yml"
              - "!devenv.*"
              - "!playwright.config.ts"
              - "!scripts/*.go"
              - "!scripts/go.*"

  static:
    name: Static checks
    runs-on: ubuntu-latest
    env:
      DATABASE_URI: postgres://postgres:postgres@localhost:5432/pragmatic-papers
      NEXT_PUBLIC_SERVER_URL: http://localhost:8000
      PAYLOAD_SECRET: ci-payload-secret
      USE_LOCAL_STORAGE: "true"

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pragmatic-papers
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Shallow clone: none of the static checks below read git history
      # (check-migration-order sorts files by name; check-pending-migrations
      # runs against the Postgres service), so the default depth-1 fetch is
      # enough and skips pulling the full history.
      - uses: actions/checkout@v7

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: "24.x"
          gh-font-read-token: ${{ secrets.GH_FONT_READ }}
          payload-secret: ci-payload-secret

      - name: Lint
        run: pnpm run lint:ci

      - name: Type check
        run: pnpm run check-types

      - name: Check migration order
        run: pnpm exec tsx scripts/check-migration-order.ts

      - name: Check for pending migrations
        run: node scripts/check-pending-migrations.mjs

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: "24.x"
          gh-font-read-token: ${{ secrets.GH_FONT_READ }}
          payload-secret: ci-unit-test-secret

      - name: Run unit and script tests
        run: pnpm test:unit:coverage

      - name: Upload base coverage artifact
        if: github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summary-dev
          path: coverage/coverage-summary.json
          retention-days: 90

      - name: Download base coverage from dev
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        id: base-coverage
        run: |
          RUN_ID=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=dev&status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty')
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" \
              --name coverage-summary-dev \
              --dir /tmp/base-coverage \
              --repo "${{ github.repository }}"
            echo "path=/tmp/base-coverage/coverage-summary.json" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post coverage report
        if: always()
        run: pnpm coverage:report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_COVERAGE_SUMMARY_PATH: ${{ steps.base-coverage.outputs.path }}

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest

    env:
      PAYLOAD_SECRET: ci-integration-secret
      USE_LOCAL_STORAGE: "true"
      DATABASE_URI: postgres://postgres:postgres@localhost:5432/pp_template

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pp_template
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: "24.x"
          gh-font-read-token: ${{ secrets.GH_FONT_READ }}
          payload-secret: ci-integration-secret

      - name: Run integration tests
        run: pnpm test:integration -- --run

  storybook:
    name: Storybook
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.storybook == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: "24.x"
          gh-font-read-token: ${{ secrets.GH_FONT_READ }}
          payload-secret: ci-storybook-secret

      # The story tests only need a browser, not the pinned e2e image.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The tests never execute a story's lazy imports; the build bundles them,
      # which is where a server-only module reaching the browser shows up.
      - name: Build Storybook
        run: pnpm storybook:build

      - name: Run story tests (interactions and axe)
        run: pnpm test:storybook --run
