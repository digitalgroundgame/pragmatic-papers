name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  # The merge queue tests each PR on top of everything queued ahead of it, on
  # a temporary gh-readonly-queue/* branch. Required checks must report there
  # too, or the queue waits on them forever. No step below writes to the
  # branch; the PR-only steps are already gated on `pull_request`.
  merge_group:

# Cancel superseded runs on a PR so a new push doesn't leave the previous
# commit's Static/Unit/Integration jobs (each starting its own test Postgres)
# running to completion for nothing. Scoped per-ref. Pushes to main/dev use a
# per-run group (github.run_id) so they never cancel each other — every commit
# landing on a protected branch is still validated in full, by the merge
# queue's run on that same commit or by its push run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which path-sensitive jobs below a PR needs. Only PRs are filtered:
  # in the merge queue this job does nothing, and the jobs gated on it run in
  # full. On a push it notes whether the merge queue already passed this
  # workflow on the commit (dev's queue lands the very commit it tested), so
  # the jobs that only check the code aren't run on it twice. A job skipped by its `if` reports "skipped",
  # which a required status check accepts, so gating a required job here never
  # blocks a PR. The gated jobs fail open: if this job fails, they run in full
  # rather than being skipped (and so passing) along with it.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: read
    outputs:
      queued: ${{ steps.queued.outputs.queued }}
      static: ${{ steps.filter.outputs.static }}
      unit: ${{ steps.filter.outputs.unit }}
      storybook: ${{ steps.filter.outputs.storybook }}
      integration: ${{ steps.filter.outputs.integration }}

    steps:
      - name: Check the merge queue
        id: queued
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          file="${WORKFLOW_REF%@*}"
          file="${file##*/}"
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$file/runs?head_sha=$GITHUB_SHA&event=merge_group&status=success&per_page=1" --jq .total_count)
          if [ "${passed:-0}" -gt 0 ]; then
            echo "::notice::The merge queue already passed this workflow on $GITHUB_SHA; skipping what it covered."
            echo "queued=true" >> "$GITHUB_OUTPUT"
          fi

      # On pull_request the filter lists changed files through the API, so
      # no checkout is needed.
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          # Each filter is a skip-list, not an allow-list: a job runs unless
          # every changed file matches one of its "!" patterns. List only
          # paths the job provably can't reach; when in doubt, leave a path
          # out, since a missed skip costs minutes and a wrong one a broken dev.
          filters: |
            # Lint and the type check read no Markdown.
            static:
              - "**"
              - "!**/*.md"
            # tests/scripts/upstream-docs.test.ts reads the upstream-docs
            # skill's Markdown, so only that skill's docs still count.
            unit:
              - "**"
              - "!*.md"
              - "!!(.claude)/**/*.md"
              - "!.claude/!(skills)/**/*.md"
              - "!.claude/skills/!(upstream-docs)/**/*.md"
            # Stories import from all over src/, and the Storybook build
            # exists to catch a server-only module reaching the browser, which
            # a change anywhere in src/ can cause.
            storybook:
              - "**"
              - "!**/*.md"
              - "!.claude/**"
              - "!tests/**"
              - "!src/migrations/**"
              - "!.github/*"
              - "!.github/workflows/!(ci).yml"
              - "!dockerfiles/**"
              - "!docker-compose*.yml"
              - "!devenv.*"
              - "!playwright.config.ts"
              - "!scripts/*.go"
              - "!scripts/go.*"
            # The integration tests load the real Payload config and run every
            # migration, so all of src/ counts except stories, which nothing
            # outside Storybook imports.
            integration:
              - "**"
              - "!**/*.md"
              - "!**/*.mdx"
              - "!**/*.stories.@(ts|tsx)"
              - "!src/stories/**"
              - "!.storybook/**"
              - "!.claude/**"
              - "!tests/e2e/**"
              - "!tests/scripts/**"
              - "!.github/*"
              - "!.github/workflows/!(ci).yml"
              - "!dockerfiles/**"
              - "!docker-compose*.yml"
              - "!devenv.*"
              - "!playwright.config.ts"
              - "!scripts/*.go"
              - "!scripts/go.*"

  static:
    name: Static checks
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.queued != 'true' && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.static == 'true') }}
    runs-on: ubuntu-latest
    # No Postgres service: check-pending-migrations starts its own with
    # scripts/test-db.mjs, the same way it does locally.
    permissions:
      contents: read
      packages: read
    env:
      # Copied into GHCR by postgres-image.yml, and pulled logged in (see the login step).
      TEST_DB_IMAGE: ghcr.io/digitalgroundgame/postgres:17-alpine
      SERVER_URL: http://localhost:8000
      PAYLOAD_SECRET: ci-payload-secret
      USE_LOCAL_STORAGE: "true"

    steps:
      # Shallow clone: none of the static checks below read git history
      # (check-migration-order sorts files by name; check-pending-migrations
      # replays migrations into a fresh database), so the default depth-1 fetch
      # is enough and skips pulling the full history.
      - uses: actions/checkout@v7

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: "24.x"
          gh-font-read-token: ${{ secrets.GH_FONT_READ }}
          payload-secret: ci-payload-secret

      - name: Lint
        run: pnpm run lint:ci

      - name: Type check
        run: pnpm run check-types

      - name: Check migration order
        run: pnpm exec tsx scripts/check-migration-order.ts

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for pending migrations
        run: node scripts/check-pending-migrations.mjs

  unit-tests:
    name: Unit tests
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.unit == 'true') }}
    runs-on: ubuntu-latest
    # Usually about 4 minutes. A hung test would otherwise hold the runner for GitHub's
    # 6-hour default before anything reports it.
    timeout-minutes: 15
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: "24.x"
          gh-font-read-token: ${{ secrets.GH_FONT_READ }}
          payload-secret: ci-unit-test-secret
          # The one bare-runner job that saves the pnpm store; the others only
          # restore it. It is skipped only on Markdown-only PRs, which never
          # change the lockfile, so every new lockfile still gets saved.
          save-pnpm-cache: "true"

      - name: Run unit and script tests
        run: pnpm test:unit:coverage

      # A PR's coverage is compared against its base branch's, so both `dev`
      # and `main` (release and hotfix PRs) keep a baseline. The artifact keeps
      # its old name so runs from before `main` uploaded one still match.
      - name: Upload base coverage artifact
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summary-dev
          path: coverage/coverage-summary.json
          retention-days: 90

      # The baseline is the coverage of the commit this PR is compared against:
      # the push run on the PR's base SHA, on its base branch (`dev`, or `main`
      # for release and hotfix PRs). Asking for "the latest successful run on
      # dev" instead can return a run from weeks ago, since GitHub doesn't keep
      # that list newest-first. With no finished run on the base SHA (it failed,
      # or is still running), the report leaves out the change column rather
      # than compare against some other commit.
      - name: Download base coverage
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        id: base-coverage
        run: |
          RUN_ID=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$BASE_SHA&event=push&per_page=20" \
            --jq '[.workflow_runs[] | select(.head_branch == env.BASE_REF and .conclusion == "success")] | max_by(.run_attempt) | .id // empty')
          if [ -z "$RUN_ID" ]; then
            echo "::notice::No successful $BASE_REF run on base commit $BASE_SHA yet; the coverage report will show no change column."
            exit 0
          fi
          echo "Base coverage: run $RUN_ID on $BASE_SHA"
          gh run download "$RUN_ID" \
            --name coverage-summary-dev \
            --dir /tmp/base-coverage \
            --repo "${{ github.repository }}"
          echo "path=/tmp/base-coverage/coverage-summary.json" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}

      - name: Post coverage report
        if: always()
        run: pnpm coverage:report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_COVERAGE_SUMMARY_PATH: ${{ steps.base-coverage.outputs.path }}

  integration-tests:
    name: Integration tests
    needs: changes
    # Fails open: runs in full unless Detect changes succeeded and cleared it,
    # or found the merge queue already passed the pushed commit.
    if: ${{ !cancelled() && needs.changes.outputs.queued != 'true' && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.integration == 'true') }}
    runs-on: ubuntu-latest

    # No Postgres service: the integration global setup starts its own with
    # scripts/test-db.mjs, as it does locally. CI sets `CI`, so it always
    # migrates a fresh database rather than reusing a snapshot.
    permissions:
      contents: read
      packages: read
    env:
      # Copied into GHCR by postgres-image.yml, and pulled logged in (see the login step).
      TEST_DB_IMAGE: ghcr.io/digitalgroundgame/postgres:17-alpine
      PAYLOAD_SECRET: ci-integration-secret
      USE_LOCAL_STORAGE: "true"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: "24.x"
          gh-font-read-token: ${{ secrets.GH_FONT_READ }}
          payload-secret: ci-integration-secret

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run integration tests
        run: pnpm test:integration -- --run

  storybook:
    name: Storybook
    needs: changes
    # Fails open: runs in full unless Detect changes succeeded and cleared it.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.storybook == 'true') }}
    runs-on: ubuntu-latest
    # The E2E job's pinned image, so the story tests run the same Chromium
    # build as the E2E suite and skip installing one. Keep the tag in step
    # with playwright.yml (scripts/check-playwright-image-pin.ts checks it).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble

    steps:
      - uses: actions/checkout@v7

      # actions/checkout's files are owned by a different UID than this
      # container's user, so git's dubious-ownership check blocks git commands
      # (Storybook asks git for the project root) unless the workspace is
      # explicitly trusted.
      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: "24.x"
          gh-font-read-token: ${{ secrets.GH_FONT_READ }}
          payload-secret: ci-storybook-secret
          # The Playwright image's saver of the pnpm store (see setup-project):
          # unlike E2E, this job runs on every push to dev, so PRs restore it.
          save-pnpm-cache: "true"

      # The tests never execute a story's lazy imports; the build bundles them,
      # which is where a server-only module reaching the browser shows up.
      - name: Build Storybook
        run: pnpm storybook:build

      - name: Run story tests (interactions and axe)
        run: pnpm test:storybook --run

      # Handed to Deploy Storybook, so what gets published is the build these
      # tests just passed.
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'merge_group'
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 1

  # Publishes the tested build to the pragmatic-papers-storybook Cloudflare
  # Worker (.storybook/wrangler.jsonc): `dev` deploys to the main workers.dev
  # address, and each PR creates or updates a `pr-<number>` Worker Preview
  # (deleted when the PR closes, by storybook-close.yml), records it as a
  # "Storybook" Deployment (listed on the PR beside the site's
  # Preview), and links each component the PR changes at the top of its
  # description (scripts/storybook-pr.ts). Kept out of the Storybook job so a Cloudflare
  # outage never turns that required check red. Skips itself without the
  # Cloudflare secrets, which fork and Dependabot PRs never receive.
  storybook-deploy:
    name: Deploy Storybook
    needs: storybook
    if: ${{ !cancelled() && needs.storybook.result == 'success' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/dev') }}
    runs-on: ubuntu-latest
    # One deploy per PR (or dev) at a time, so an older build never lands last.
    concurrency:
      group: storybook-deploy-${{ github.event.pull_request.number || github.ref }}
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"

    steps:
      - name: Skip without Cloudflare secrets
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not available; skipping the Storybook deploy."

      - uses: actions/checkout@v7
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          sparse-checkout: |
            .storybook/
            scripts/storybook-pr.ts
            scripts/pr-description.ts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          name: storybook-static
          path: storybook-static

      - name: Deploy to the main address
        if: env.HAS_CLOUDFLARE == 'true' && github.event_name != 'pull_request'
        run: npx --yes wrangler@4 deploy --config .storybook/wrangler.jsonc

      # A PR closed while this run was building has already had its Preview
      # deleted by storybook-close.yml; deploying now would bring it back.
      - name: Skip a closed PR
        id: open
        if: env.HAS_CLOUDFLARE == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          state=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq .state)
          if [ "$state" = "OPEN" ]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::PR #$PR_NUMBER is $state; skipping its Storybook preview."
          fi

      # A Worker Preview, unlike a `versions upload --preview-alias` alias, can
      # be deleted, so storybook-close.yml removes it when the PR closes.
      - name: Deploy a PR preview
        id: preview
        if: steps.open.outputs.open == 'true'
        env:
          PREVIEW: pr-${{ github.event.pull_request.number }}
          WRANGLER_OUTPUT_FILE_PATH: wrangler-output.json
        run: |
          npx --yes wrangler@4 preview --config .storybook/wrangler.jsonc --name "$PREVIEW"
          url=$(jq -r 'select(.type == "preview") | .preview_urls[]?' "$WRANGLER_OUTPUT_FILE_PATH" \
            | grep -oE "^(https://)?${PREVIEW}-[a-z0-9.-]+\.workers\.dev" | head -n 1 || true)
          if [ -z "$url" ]; then
            # Previews get a workers.dev URL only while the Worker has Preview
            # URLs on; `preview_urls` in wrangler.jsonc applies on the next `dev` deploy.
            echo "::error::wrangler reported no workers.dev URL for the $PREVIEW Preview. Turn on Preview URLs for the Worker (Cloudflare dashboard: pragmatic-papers-storybook > Settings > Domains & Routes), then re-run this job."
            exit 1
          fi
          echo "url=https://${url#https://}" >> "$GITHUB_OUTPUT"

      # Node 24 runs the TypeScript script directly; no install needed.
      - uses: actions/setup-node@v7
        if: steps.preview.outputs.url
        with:
          node-version: "24.x"

      - name: Record the preview as a Deployment
        if: steps.preview.outputs.url
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: node scripts/storybook-pr.ts deploy

      - name: Link the changed components in the PR description
        if: steps.preview.outputs.url
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          INDEX_FILE: storybook-static/index.json
        run: node scripts/storybook-pr.ts link
