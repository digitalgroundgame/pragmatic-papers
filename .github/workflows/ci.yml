name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    env:
      DATABASE_URI: postgres://postgres:postgres@localhost:5432/pragmatic-papers
      NEXT_PUBLIC_SERVER_URL: http://localhost:8000
      PAYLOAD_SECRET: ci-payload-secret
      USE_LOCAL_STORAGE: "true"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: "24.x"
          gh-font-read-token: ${{ secrets.GH_FONT_READ }}
          payload-secret: ci-payload-secret

      - name: Lint
        run: pnpm run lint:ci

      - name: Type check
        run: pnpm run check-types

      - name: Check migration order
        run: pnpm exec tsx scripts/check-migration-order.ts

      - name: Check for pending migrations
        run: node scripts/check-pending-migrations.mjs

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: "24.x"
          gh-font-read-token: ${{ secrets.GH_FONT_READ }}
          payload-secret: ci-unit-test-secret

      - name: Run unit tests
        run: pnpm test:unit:coverage

      - name: Run script tests
        run: pnpm test:scripts -- --run

      - name: Post coverage report
        uses: davelosert/vitest-coverage-report-action@v2

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest

    env:
      PAYLOAD_SECRET: ci-integration-secret
      USE_LOCAL_STORAGE: "true"

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: "24.x"
          gh-font-read-token: ${{ secrets.GH_FONT_READ }}
          payload-secret: ci-integration-secret

      - name: Run integration tests
        run: pnpm test:integration -- --run
