name: Claude Code Review

# Reviews a PR into dev on its own when it goes from draft to ready for
# review, and again whenever the "in review" label is added. Mentioning
# @claude asks for one too (claude.yml). The action posts a progress comment
# on the PR that it updates in place until the review is done
# (`track_progress`), and the run's check is listed on the PR.
#
# The review takes the "in review" label off when it's done, so adding it
# again asks for another, and Lighthouse stops running on the pushes that
# follow (playwright.yml runs it on PRs with the label). Drafts never run it,
# and a PR opened ready gets one only from the label or @claude. Adding any
# other label leaves a skipped "Claude review" check.
#
# Not a required check: what gates merging is "Review acknowledged"
# (review-ack.yml), which a person gives either by approving the PR or, on
# their own PR, by replying `/reviewed` on its final commit after a review
# like this one has run. So only PRs that take the `/reviewed` path need a
# review, and fixing what it found needs no second review, only a new reply.
#
# The action skips a run whose copy of this file differs from dev's, so a PR
# that changes it gets no review until it's merged.
#
# The job fails when the review reports a blocker, which marks the reviewed
# commit with a ✗. It never approves.
on:
  pull_request:
    types: [ready_for_review, labeled]

# A run for any other label must not cancel a review in progress, so it gets a
# group of its own.
concurrency:
  group: >-
    claude-review-${{ github.event.pull_request.number }}-${{
      (github.event.action == 'labeled' && github.event.label.name != 'in review') && github.run_id || 'review' }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review
    runs-on: ubuntu-latest
    # Forks get no secrets.
    if: >-
      github.event.pull_request.base.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft && (
        github.event.action == 'ready_for_review' ||
        github.event.action == 'labeled' && github.event.label.name == 'in review'
      )
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # A pull_request run's github.sha is the merge commit GitHub makes with
      # dev; the review is of the PR's own head.
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      # Under the job's limit: a job timeout cancels the run, which skips the
      # steps below and leaves the label on. A step timeout only stops this
      # step, so the verdict is still reported.
      - name: Run Claude code review
        id: review
        timeout-minutes: 17
        uses: anthropics/claude-code-action@v1
        with:
          # A Claude subscription token from `claude setup-token`, so reviews
          # count against that plan rather than an API key's credits.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: "/code-review --comment ${{ github.repository }}/pull/${{ env.PR_NUMBER }} --head ${{ env.HEAD_SHA }}"
          claude_args: |
            --model opus
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git blame:*)"

      # The action logs only how many tool calls were denied. Its execution
      # file holds the result message, whose permission_denials name each
      # tool and its input, so a denial shows up as a warning on the run.
      - name: List denied tool calls
        if: always() && steps.review.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          jq -r '.[] | select(.type == "result") | .permission_denials[]?
            | "\(.tool_name): \(.tool_input | tojson | .[0:300])"' "$EXECUTION_FILE" \
            | while IFS= read -r line; do echo "::warning::Denied $line"; done || true

      # The summary comment ends with a marker naming the commit reviewed and
      # the verdict (see `--head` in .claude/skills/code-review/SKILL.md).
      - name: Check the verdict
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          marker=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "claude[bot]") | .body' \
            | grep -o "<!-- claude-review sha=$HEAD_SHA verdict=[a-z]* -->" | tail -n 1 || true)
          if [ -z "$marker" ]; then
            echo "::error::No review summary for $HEAD_SHA was posted. See the step above."
            exit 1
          fi
          if [[ "$marker" == *"verdict=blocker"* ]]; then
            echo "::error::The review found a blocker. Fix it, then reply /reviewed on the PR."
            exit 1
          fi
          echo "No blockers on $HEAD_SHA."

      # Done with the label: adding it again asks for another review, and later
      # pushes skip Lighthouse. A cancelled run leaves it for the run that replaced
      # it. Removing a label the PR no longer has is fine.
      - name: Remove the "in review" label
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api -X DELETE "repos/$REPO/issues/$PR_NUMBER/labels/in%20review" >/dev/null 2>&1 || true
