name: Claude Code Review

# Reviews a PR into dev on its own when it goes from draft to ready for
# review, and again whenever the "in review" label is added. Mentioning
# @claude asks for one too (claude.yml). The review is one comment: the
# action's progress comment, which it updates in place while it works
# (`track_progress`) and which ends up holding the review's summary. The run's
# check is listed on the PR.
#
# The review takes the "in review" label off when it's done, so adding it
# again asks for another, and Lighthouse stops running on the pushes that
# follow (playwright.yml runs it on PRs with the label). Drafts never run it,
# and a PR opened ready gets one only from the label or @claude. Adding any
# other label leaves a skipped "Claude review" check.
#
# Not a required check: what gates merging is "Review acknowledged"
# (review-ack.yml), which a person gives either by approving the PR or, on
# their own PR, by replying `/reviewed` on its final commit after a review
# like this one has run. So only PRs that take the `/reviewed` path need a
# review, and fixing what it found needs no second review, only a new reply.
#
# The action skips a run whose copy of this file differs from dev's, so a PR
# that changes it gets no review until it's merged.
#
# The job fails when the review reports a blocker, which marks the reviewed
# commit with a ✗. It never approves with a GitHub review. When the review finds
# no blocker or should-fix and every file the PR changes is one dev's
# `.claude/approvals.yml` lets Claude approve (docs, tests, stories, nothing
# sensitive), a script, not Claude, gives the commit "Review acknowledged" itself
# (scripts/approval-policy.ts), so no `/reviewed` is needed.
on:
  pull_request:
    types: [ready_for_review, labeled]

# A run for any other label must not cancel a review in progress, so it gets a
# group of its own.
concurrency:
  group: >-
    claude-review-${{ github.event.pull_request.number }}-${{
      (github.event.action == 'labeled' && github.event.label.name != 'in review') && github.run_id || 'review' }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review
    runs-on: ubuntu-latest
    # Forks get no secrets.
    if: >-
      github.event.pull_request.base.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft && (
        github.event.action == 'ready_for_review' ||
        github.event.action == 'labeled' && github.event.label.name == 'in review'
      )
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      # The approval policy's "Review acknowledged" status.
      statuses: write

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # A pull_request run's github.sha is the merge commit GitHub makes with
      # dev; the review is of the PR's own head.
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      # The review's effort follows the PR: medium for a small one, high for
      # most, xhigh for a large one, and a level higher where a mistake is
      # costly (CI, migrations, access, sign-in). Without it every review ran
      # at Opus's default, medium. See scripts/review-effort.ts.
      #
      # It runs dev's copy of the script, never the PR's: this job can mint the
      # OIDC token the action trades for a Claude GitHub App token, and the
      # action only checks that this workflow file matches dev's, not the
      # scripts it runs. So a change to the script takes effect once merged,
      # and until dev has one the review runs at the default.
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Pick the review's effort
        id: effort
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          script="$RUNNER_TEMP/review-effort.ts"
          if git show "$BASE_SHA:scripts/review-effort.ts" > "$script" 2>/dev/null; then
            node "$script" "$BASE_SHA" "$HEAD_SHA"
          else
            echo "dev has no scripts/review-effort.ts yet; reviewing at the default effort."
          fi

      # Under the job's limit: a job timeout cancels the run, which skips the
      # steps below and leaves the label on. A step timeout only stops this
      # step, so the verdict is still reported.
      - name: Run Claude code review
        id: review
        timeout-minutes: 17
        uses: anthropics/claude-code-action@v1
        with:
          # A Claude subscription token from `claude setup-token`, so reviews
          # count against that plan rather than an API key's credits.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          # track_progress runs the action in tag mode, which reads `prompt` as
          # instructions under its own (not as a slash command), and posts
          # through its progress comment, from which it strips HTML comments.
          # So the summary is that comment's final body and ends with the marker
          # as a link reference definition, which GitHub doesn't render and
          # review-ack.yml looks for. The verdict also comes back as structured
          # output (--json-schema).
          prompt: |
            Review this pull request by following .claude/skills/code-review/SKILL.md for
            ${{ github.repository }}/pull/${{ env.PR_NUMBER }} at ${{ env.HEAD_SHA }}, in its progress-comment mode:
            the summary is the final body of your progress comment, ending with a blank line and then
            `[claude-review]: #sha=${{ env.HEAD_SHA }}&verdict=<pass|blocker>` as its last line, and you
            post no other top-level comment. Return the same verdict as your structured output, with the
            number of findings at each severity (blocker, should_fix, worth_noting) in `findings`.
          claude_args: |
            --model opus
            ${{ steps.effort.outputs.effort && format('--effort {0}', steps.effort.outputs.effort) || '' }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git blame:*)"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["pass","blocker"]},"findings":{"type":"object","properties":{"blocker":{"type":"integer","minimum":0},"should_fix":{"type":"integer","minimum":0},"worth_noting":{"type":"integer","minimum":0}},"required":["blocker","should_fix","worth_noting"]}},"required":["verdict","findings"]}'

      # The action logs only how many tool calls were denied. Its execution
      # file holds the result message, whose permission_denials name each
      # tool and its input, so a denial shows up as a warning on the run.
      - name: List denied tool calls
        if: always() && steps.review.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          jq -r '.[] | select(.type == "result") | .permission_denials[]?
            | "\(.tool_name): \(.tool_input | tojson | .[0:300])"' "$EXECUTION_FILE" \
            | while IFS= read -r line; do echo "::warning::Denied $line"; done || true

      # The verdict is the review's structured output. The progress comment
      # must also end with the marker naming this commit, or `/reviewed` won't
      # find the review (review-ack.yml).
      - name: Check the verdict
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERDICT: ${{ steps.review.outputs.structured_output && fromJSON(steps.review.outputs.structured_output).verdict || '' }}
        run: |
          marker=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "claude[bot]") | .body' \
            | grep -oE "(<sub>claude-review sha=$HEAD_SHA verdict=[a-z]*</sub>|\[claude-review\]: #sha=$HEAD_SHA&verdict=[a-z]*)" \
            | tail -n 1 || true)
          if [ -z "$marker" ]; then
            echo "::error::The review's comment doesn't end with the marker for $HEAD_SHA, so /reviewed can't count it. See the step above."
            exit 1
          fi
          if [ -z "$VERDICT" ]; then
            VERDICT=$(sed -E 's/.*verdict=([a-z]*).*/\1/' <<< "$marker")
          fi
          if [ "$VERDICT" = "blocker" ]; then
            echo "::error::The review found a blocker. Fix it, then reply /reviewed on the PR."
            exit 1
          fi
          echo "No blockers on $HEAD_SHA."

      # Low-risk PRs need no `/reviewed`: when dev's approval policy lets Claude
      # approve every file the PR changes and the review found nothing to fix,
      # this records "Review acknowledged" on the reviewed commit, as review-ack.yml
      # does for a reply. Like the effort step, it runs dev's copies of the script
      # and the policy, never the PR's, and a PR that changes the policy always
      # needs a person. The runner's yq turns the policy into JSON, so the script
      # needs no install. A push after the review needs a new one, as with `/reviewed`.
      - name: Apply the approval policy
        id: policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          REVIEW: ${{ steps.review.outputs.structured_output }}
        run: |
          script="$RUNNER_TEMP/approval-policy.ts"
          if ! git show "$BASE_SHA:scripts/approval-policy.ts" > "$script" 2>/dev/null ||
            ! git show "$BASE_SHA:.claude/approvals.yml" | yq -o=json '.' > "$RUNNER_TEMP/approvals.json"; then
            echo "dev has no approval policy yet; /reviewed or an approval is needed."
            exit 0
          fi
          git diff --raw --no-renames "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/diff.txt"
          printf '%s' "$REVIEW" > "$RUNNER_TEMP/review.json"
          node "$script" "$RUNNER_TEMP/approvals.json" "$RUNNER_TEMP/diff.txt" "$RUNNER_TEMP/review.json" "$AUTHOR_TYPE"

      - name: Record "Review acknowledged"
        if: steps.policy.outputs.approve == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" \
            -f state=success \
            -f context="Review acknowledged" \
            -f description="Approved by policy after Claude's review" >/dev/null
          echo "::notice::Review acknowledged by .claude/approvals.yml: no /reviewed needed."

      # Done with the label: adding it again asks for another review, and later
      # pushes skip Lighthouse. A cancelled run leaves it for the run that replaced
      # it. Removing a label the PR no longer has is fine.
      - name: Remove the "in review" label
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api -X DELETE "repos/$REPO/issues/$PR_NUMBER/labels/in%20review" >/dev/null 2>&1 || true
