name: Claude Code Review

# Runs once when the "in review" label is added (or when a labeled
# draft is marked ready); to review again, remove and re-add the label. Drafts
# and unlabeled PRs never run it. pr-events.yml starts it on the PR's
# branch, so every other label doesn't leave a skipped check, and sets a
# pending "Claude review" commit status on the PR's head, which the last step
# here completes: a dispatched run's own check isn't listed on the PR. Not a required check: what gates merging is
# "Review acknowledged" (review-ack.yml), which a person gives either by
# approving the PR or, on their own PR, by replying `/reviewed` on its final
# commit after a review like this one has run. So only PRs that take the
# `/reviewed` path need a review, and fixing what it found needs no second
# review, only a new reply.
#
# The job fails when the review reports a blocker, which marks the reviewed
# commit with a ✗. It never approves.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: The PR to review, run on its branch
        required: true

concurrency:
  group: claude-review-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      statuses: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Claude code review
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          # A Claude subscription token from `claude setup-token`, so reviews
          # count against that plan rather than an API key's credits.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # pr-events.yml dispatches this with the workflow token, so the run's
          # actor is github-actions[bot], which the action refuses by default.
          # Dispatching needs write access, so no outside bot can start it.
          allowed_bots: github-actions
          prompt: "/code-review --comment ${{ github.repository }}/pull/${{ inputs.pr }} --head ${{ github.sha }}"
          claude_args: |
            --model opus
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git blame:*)"

      # The action logs only how many tool calls were denied. Its execution
      # file holds the result message, whose permission_denials name each
      # tool and its input, so a denial shows up as a warning on the run.
      - name: List denied tool calls
        if: always() && steps.review.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          jq -r '.[] | select(.type == "result") | .permission_denials[]?
            | "\(.tool_name): \(.tool_input | tojson | .[0:300])"' "$EXECUTION_FILE" \
            | while IFS= read -r line; do echo "::warning::Denied $line"; done || true

      # The summary comment ends with a marker naming the commit reviewed and
      # the verdict (see `--head` in .claude/skills/code-review/SKILL.md).
      - name: Check the verdict
        id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          marker=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "claude[bot]") | .body' \
            | grep -o "<!-- claude-review sha=$HEAD_SHA verdict=[a-z]* -->" | tail -n 1 || true)
          if [ -z "$marker" ]; then
            echo "description=No review summary was posted" >> "$GITHUB_OUTPUT"
            echo "::error::No review summary for $HEAD_SHA was posted. See the step above."
            exit 1
          fi
          if [[ "$marker" == *"verdict=blocker"* ]]; then
            echo "description=Found a blocker" >> "$GITHUB_OUTPUT"
            echo "::error::The review found a blocker. Fix it, then reply /reviewed on the PR."
            exit 1
          fi
          echo "description=No blockers" >> "$GITHUB_OUTPUT"
          echo "No blockers on $HEAD_SHA."

      # Completes the pending status pr-events.yml set when it started this run.
      # A cancelled run reports nothing: the run that replaced it set its own
      # pending status, which this one must not overwrite.
      - name: Report the result on the PR
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          DESCRIPTION: ${{ steps.verdict.outputs.description || 'The review failed' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" -f state="$STATE" \
            -f context="Claude review" -f description="$DESCRIPTION" -f target_url="$RUN_URL" >/dev/null
