name: Claude Code Review

# Required on dev as the "Claude review" check, so a PR can't merge until a
# review has run on its current head commit and found no blocker. It never
# approves: a person still merges, after acknowledging the review with a
# `/reviewed` reply (see review-ack.yml).
#
# A review runs when the "ready for review" label is added, and again on each
# push or draft → ready while the label stays on. Draft and unlabeled PRs never
# run it, so they show the check as "Expected", not as a failure.
on:
  pull_request:
    types: [labeled, synchronize, ready_for_review]
    branches: [dev]
  merge_group:

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review
    # Same-repo PRs only: a fork PR gets no secrets here.
    if: >-
      github.event_name == 'merge_group' || (
        github.event.pull_request.head.repo.full_name == github.repository &&
        !github.event.pull_request.draft && (
          github.event.action == 'labeled' && github.event.label.name == 'ready for review' ||
          github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'ready for review')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      # The queue branch holds only commits whose PR already passed this check
      # on its head, so there's nothing new to review.
      - name: Pass in the merge queue
        if: github.event_name == 'merge_group'
        run: echo "Reviewed on the pull request."

      - name: Checkout repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Claude code review
        if: github.event_name == 'pull_request'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY_CODE_REVIEW }}
          prompt: "/code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --head ${{ github.event.pull_request.head.sha }}"
          claude_args: |
            --model opus
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      # The summary comment ends with a marker naming the commit reviewed and
      # the verdict (see `--head` in .claude/skills/code-review/SKILL.md).
      - name: Check the verdict
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "claude[bot]") | .body' \
            | grep -o "<!-- claude-review sha=$HEAD_SHA verdict=[a-z]* -->" | tail -n 1 || true)
          if [ -z "$marker" ]; then
            echo "::error::No review summary for $HEAD_SHA was posted. See the step above."
            exit 1
          fi
          if [[ "$marker" == *"verdict=blocker"* ]]; then
            echo "::error::The review found a blocker. Fix it and push, which reviews again."
            exit 1
          fi
          echo "No blockers on $HEAD_SHA."
