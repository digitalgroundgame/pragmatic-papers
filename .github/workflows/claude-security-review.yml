name: Claude Security Review

# A security-only review of a PR into dev, following
# .claude/skills/security-review/SKILL.md (adapted from Claude Code's
# /security-review). It runs when Claude Code Review does (claude-review.yml):
# when a draft is marked ready for review, and whenever the "in review" label
# is added. claude-review.yml takes the label off when its review is done, so
# adding it again asks for both again. Drafts never run it, and adding any
# other label leaves a skipped check.
#
# Findings are inline comments, and the action's progress comment holds the
# summary. Informational only: it never fails on a finding, never approves,
# and isn't a required check.
#
# It runs on the same subscription token as the code review
# (CLAUDE_CODE_OAUTH_TOKEN), so it costs plan usage, not API credits.
# Anthropic's claude-code-security-review action needs an API key, which is
# why this uses claude-code-action instead.
#
# The action skips a run whose copy of this file differs from dev's, so a PR
# that changes it gets no security review until it's merged.
on:
  pull_request:
    types: [ready_for_review, labeled]

# A run for any other label must not cancel a review in progress, so it gets a
# group of its own.
concurrency:
  group: >-
    claude-security-review-${{ github.event.pull_request.number }}-${{
      (github.event.action == 'labeled' && github.event.label.name != 'in review') && github.run_id || 'review' }}
  cancel-in-progress: true

jobs:
  security-review:
    name: Claude security review
    runs-on: ubuntu-latest
    # Forks get no secrets.
    if: >-
      github.event.pull_request.base.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft && (
        github.event.action == 'ready_for_review' ||
        github.event.action == 'labeled' && github.event.label.name == 'in review'
      )
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # A pull_request run's github.sha is the merge commit GitHub makes with
      # dev; the review is of the PR's own head.
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - name: Run Claude security review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            Review this pull request for security vulnerabilities by following
            .claude/skills/security-review/SKILL.md for ${{ github.repository }}/pull/${{ env.PR_NUMBER }}
            at ${{ env.HEAD_SHA }}, in CI mode: findings inline, the summary as the final body of
            your progress comment, and no other top-level comment.
          # The model is left to the action's default.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git blame:*)"
