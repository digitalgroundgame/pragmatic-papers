name: Claude Code

# The action's own @claude workflow: mention @claude in a comment, a review or
# an issue and Claude answers there, and can push to the PR's branch when
# asked. Only people with write access can start it (the action checks), and
# comments an agent posted (they carry the Claude Code footer) never do, so
# Claude sessions can't set each other off.
#
# "@claude review" on a PR follows the same code-review skill as
# claude-review.yml, so its summary ends in the marker `/reviewed` and `LGTM`
# need (review-ack.yml).
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    name: Claude
    if: >-
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        !contains(github.event.comment.body, 'Generated by [Claude Code]')) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        !contains(github.event.comment.body, 'Generated by [Claude Code]')) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        !contains(github.event.review.body, 'Generated by [Claude Code]')) ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      # Lets Claude read CI results on PRs.
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          # A Claude subscription token, as in claude-review.yml.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: |
            --model opus
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git blame:*)"
            --append-system-prompt "When asked to review a pull request, follow .claude/skills/code-review/SKILL.md in --comment mode for it, posting its summary, marker last, with gh pr comment (your progress comment strips the marker) and ending your progress comment with the verdict line and a link to it. Never post /reviewed or LGTM, and never approve: both stand for a person having read the change."
