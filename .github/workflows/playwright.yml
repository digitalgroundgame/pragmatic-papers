name: Playwright Tests

# Functional E2E tests against the image a PR deploys, the PR's preview, and
# page speed. Visual changes are reviewed in Storybook and the preview.
on:
  push:
    branches: [main, dev]
  pull_request:
  # See ci.yml: required checks must also run in the merge queue.
  merge_group:

# A new push to the same branch cancels the run testing the old one, so a
# stale run can't deploy its image as the preview.
concurrency:
  group: playwright-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

# The E2E environment (database, server URL, FONTS_REQUIRED, ...) is set by
# .github/actions/setup-e2e, shared by the E2E tests and Page speed jobs.
#
# One image per run: "Build image" builds it, "E2E tests" runs the
# suite against it, and "Deploy preview" hands the same image to Coolify as
# the PR's preview. Removing a closed PR's preview stays in preview-image.yml.

jobs:
  # Plans the run. Skips the suite on a PR that changes only Markdown, the
  # same way ci.yml's "Detect changes" job does: a skipped required check
  # passes, only PRs are filtered, and if this job fails the suite runs in
  # full. On a push it notes whether the merge queue already ran this workflow
  # on the commit, and decides whether and how a PR gets a preview.
  changes:
    name: Detect E2E changes
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: read
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
      queued: ${{ steps.queued.outputs.queued }}
      preview: ${{ steps.plan.outputs.preview }}
      tag: ${{ steps.plan.outputs.tag }}
      image: ${{ steps.plan.outputs.image }}

    steps:
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            e2e:
              - "**"
              - "!**/*.md"

      # dev's merge queue lands the very commit it tested, so a push run on a
      # commit whose merge_group run passed would only repeat the suite.
      - name: Check the merge queue
        id: queued
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          file="${WORKFLOW_REF%@*}"
          file="${file##*/}"
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$file/runs?head_sha=$GITHUB_SHA&event=merge_group&status=success&per_page=1" --jq .total_count)
          if [ "${passed:-0}" -gt 0 ]; then
            echo "::notice::The merge queue already passed this workflow on $GITHUB_SHA; skipping what it covered."
            echo "queued=true" >> "$GITHUB_OUTPUT"
          fi

      # Whether this run deploys a preview, and how. Previews go to the PRs
      # Coolify would preview itself: same-repo PRs from owners, members and
      # collaborators, not titled [skip ci] / [skip cd]. Fork PRs get no
      # secrets, and fork and Dependabot runs can't push to GHCR.
      #   - image: the preview app runs the image "Build image" builds
      #     (COOLIFY_PREVIEW_IMAGE_APP_UUID set).
      #   - coolify: the fallback, where staging builds previews on its own
      #     webhook and "Deploy preview" only mirrors that build onto the PR
      #     (dockerfiles/README.md, "Falling back to Coolify-built previews").
      - id: plan
        env:
          ELIGIBLE: >-
            ${{
              github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository &&
              contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) &&
              !contains(github.event.pull_request.title, '[skip ci]') &&
              !contains(github.event.pull_request.title, '[skip cd]')
            }}
          IMAGE_APP: ${{ vars.COOLIFY_PREVIEW_IMAGE_APP_UUID }}
          STAGING_APP: ${{ vars.COOLIFY_PREVIEW_APP_UUID }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$ELIGIBLE" = "true" ] && [ -n "$IMAGE_APP" ]; then
            {
              echo "preview=image"
              echo "image=ghcr.io/${OWNER,,}/pragmatic-papers-preview"
              echo "tag=pr-${PR}-${SHA::12}"
            } >> "$GITHUB_OUTPUT"
          elif [ "$ELIGIBLE" = "true" ] && [ -n "$STAGING_APP" ]; then
            echo "preview=coolify" >> "$GITHUB_OUTPUT"
          fi

  image:
    name: Build image
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.preview == 'image' || github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.e2e == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    # What `next build` prerenders from. Nothing it reads ends up served: the
    # server throws the prerendered routes away once it runs on its own
    # database (dockerfiles/scripts/start.sh, and scripts/test-e2e.mjs here).
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: build
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-app-image
        with:
          gh-font-read-token: ${{ secrets.GH_FONT_READ }}
          source-commit: ${{ github.event.pull_request.head.sha || github.sha }}
          push-tag: ${{ needs.changes.outputs.preview == 'image' && format('{0}:{1}', needs.changes.outputs.image, needs.changes.outputs.tag) || '' }}
          registry-token: ${{ github.token }}

  # Hands the image E2E is testing to Coolify as the PR's preview, alongside
  # the tests rather than after them, as previews always have been. In the
  # fallback (the plan's `coolify`), staging builds the preview itself and this
  # only mirrors that build onto the PR. A new push cancels this run (the
  # workflow's concurrency group) before it can deploy a stale image.
  # showcase.yml pushes showcase articles once this workflow finishes.
  deploy:
    name: Deploy preview
    needs: [changes, image]
    if: ${{ !cancelled() && (needs.changes.outputs.preview == 'image' && needs.image.result == 'success' || needs.changes.outputs.preview == 'coolify') }}
    runs-on: ubuntu-latest
    # scripts/preview-deployment.ts waits on Coolify, first boot included
    # (copying staging): up to 10 min for the fallback's build to be queued,
    # then 45 for the build, so its own timeout marks the Deployment failed
    # before the runner's does.
    timeout-minutes: 60
    permissions:
      contents: read
      deployments: write
      # Links the live preview at the top of the PR's description.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/preview-deployment.ts
            scripts/pr-description.ts
          sparse-checkout-cone-mode: false

      # Node 24 runs the TypeScript script directly; no install needed.
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      # A PR closed while this run was building has had its preview removed
      # (preview-image.yml); deploying now would bring it back.
      - name: Check the PR is still open
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: echo "state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .state)" >> "$GITHUB_OUTPUT"

      - name: Deploy to Coolify and mirror its status
        if: steps.open.outputs.state == 'open'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COOLIFY_DASHBOARD_URL: ${{ vars.COOLIFY_DASHBOARD_URL }}
          COOLIFY_PREVIEW_APP_UUID: ${{ needs.changes.outputs.preview == 'image' && vars.COOLIFY_PREVIEW_IMAGE_APP_UUID || vars.COOLIFY_PREVIEW_APP_UUID }}
          PREVIEW_URL_TEMPLATE: ${{ vars.PREVIEW_URL_TEMPLATE }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          # The fallback has no tag, and follows the build staging started for
          # this push (not one queued before it) instead of deploying an image.
          EVENT_AT: ${{ github.event.pull_request.updated_at }}
          TAG: ${{ needs.changes.outputs.tag }}
        run: node scripts/preview-deployment.ts deploy ${TAG:+"$TAG"}

  test:
    name: E2E tests
    needs: [changes, image]
    # Runs even when the image failed, so the failure lands on this required
    # check: a skipped required check counts as passing. Skipped on a push the
    # merge queue already tested.
    if: ${{ !cancelled() && needs.changes.outputs.queued != 'true' && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.e2e == 'true') }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # Pinned to the exact @playwright/test version resolved in
    # pnpm-lock.yaml, so the image ships the browsers that version drives
    # and the job skips installing them (scripts/check-playwright-image-pin.ts
    # checks the tag). Node is only matched at the major version (24.x)
    # between setup-project and the image's bundled Node.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble

    permissions:
      contents: read

    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Must match TEST_DATABASE_URI in .github/actions/setup-e2e.
          POSTGRES_DB: pragmatic-papers-e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Stop if the image didn't build
        if: needs.image.result != 'success'
        env:
          RESULT: ${{ needs.image.result }}
        run: |
          echo "::error::The Build image job ended with '$RESULT'; there's no image to test."
          exit 1

      - uses: actions/checkout@v7

      - name: Set up E2E
        uses: ./.github/actions/setup-e2e
        with:
          gh-font-read-token: ${{ secrets.GH_FONT_READ }}

      - name: Run Playwright tests
        env:
          # The image's server shares this container's network (scripts/test-e2e.mjs).
          E2E_NETWORK_CONTAINER: ${{ job.container.id }}
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # Page speed, compared with dev's last measurement. Report-only: each part
  # posts how the PR compares with dev to the PR's analytics comment and
  # annotates big regressions, but never fails. Pushes to dev upload the
  # measurements PRs compare with. In its own job so the E2E suite doesn't
  # share the runner's CPU with Lighthouse.
  #   - Bundle size: the client JavaScript and CSS each public page loads, read
  #     from the image's build manifests (scripts/bundle-size.ts). A page whose
  #     JavaScript grew by more than 10 kB gets a warning.
  #   - Lighthouse: the performance audit of a few seeded pages
  #     (scripts/lighthouse.ts).
  page-speed:
    name: Page speed
    needs: [changes, image]
    if: ${{ !cancelled() && needs.image.result == 'success' && ((github.event_name == 'pull_request' && (needs.changes.result != 'success' || needs.changes.outputs.e2e == 'true')) || (github.event_name == 'push' && github.ref == 'refs/heads/dev')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The E2E job's container, for its Chromium and the shared setup-e2e action.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    permissions:
      actions: read
      contents: read
      pull-requests: write

    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Must match TEST_DATABASE_URI in .github/actions/setup-e2e.
          POSTGRES_DB: pragmatic-papers-e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      # Also loads the app image into Docker, for both parts.
      - name: Set up E2E
        id: setup
        uses: ./.github/actions/setup-e2e
        with:
          gh-font-read-token: ${{ secrets.GH_FONT_READ }}

      # The build the PR deploys, rather than a second `next build` here.
      - name: Copy the build out of the image
        run: |
          id=$(docker create pragmatic-papers-app:ci)
          docker cp "$id:/app/.next" "$RUNNER_TEMP/next"
          docker rm "$id"

      - name: Download dev's bundle size
        id: base-bundle
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/download-dev-artifact
        with:
          name: bundle-size

      - name: Measure bundle size and compare with dev
        env:
          BASE_BUNDLE_SIZE_PATH: ${{ steps.base-bundle.outputs.dir && format('{0}/bundle-size.json', steps.base-bundle.outputs.dir) || '' }}
          BUNDLE_SIZE_OUT: bundle-size.json
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: pnpm bundle-size --next-dir "$RUNNER_TEMP/next"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: bundle-size
          path: bundle-size.json
          retention-days: 90

      # Lighthouse runs even if the bundle size measurement failed.
      - name: Download dev's Lighthouse results
        id: base
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && github.event_name == 'pull_request' }}
        uses: ./.github/actions/download-dev-artifact
        with:
          name: lighthouse-results

      # Seeds the database and starts the image as the E2E suite does, then runs
      # Lighthouse against it in place of Playwright.
      - name: Run Lighthouse
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          E2E_COMMAND: pnpm exec tsx scripts/lighthouse.ts
          BASE_LIGHTHOUSE_PATH: ${{ steps.base.outputs.dir && format('{0}/summary.json', steps.base.outputs.dir) || '' }}
          E2E_NETWORK_CONTAINER: ${{ job.container.id }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-results
          path: lighthouse-results/
          retention-days: 90
