name: Playwright Tests

# Screenshot baseline lifecycle:
#   - Missing baselines (new screenshot tests) are generated automatically on
#     every PR/push run and committed straight to the branch — safe because
#     there's no existing baseline to regress against, and rendering is now
#     pinned (production server, fixed locale/timezone/color-scheme,
#     waitForStableRender) so they don't drift between runs.
#   - A mismatch against an EXISTING baseline fails the run and posts a
#     "Visual regressions detected" PR comment with actual/diff/expected
#     images — it is never auto-committed.
#   - To accept an intentional visual change, run the "Update snapshot
#     baselines" workflow manually on the branch (or `gh workflow run
#     update-snapshots.yml --ref <branch>` from a terminal — no browser
#     needed). It lives in its own workflow file (update-snapshots.yml) so it
#     doesn't show up as a permanently skipped check here.
on:
  push:
    branches: [main, dev]
  pull_request:
  # See ci.yml: required checks must also run in the merge queue. There, a
  # missing baseline fails instead of being written, and nothing is pushed
  # back, since the queue's gh-readonly-queue/* branch is read-only and
  # baselines belong in the PR.
  merge_group:

# Shared with update-snapshots.yml's group: both workflows can push a
# baseline commit to the same branch, so a stale run's push would otherwise
# race a newer one's. Cancelling the older run shrinks that race window from
# the whole E2E run down to GitHub's cancellation grace period — not a hard
# guarantee, but the practical case (two full runs finishing close together)
# can no longer happen.
concurrency:
  group: snapshot-baselines-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

# The E2E environment (database, server URL, FONTS_REQUIRED, ...) is set by
# .github/actions/setup-e2e, shared with update-snapshots.yml so the two
# workflows always render the same page.
#
# One image per run: "Build image" builds it, "E2E tests" runs the
# suite against it, and "Deploy preview" hands the same image to Coolify as
# the PR's preview. Removing a closed PR's preview stays in preview-image.yml.

jobs:
  # Skips the suite on a PR that changes only Markdown, the same way ci.yml's
  # "Detect changes" job does: a skipped required check passes, only PRs are
  # filtered, and if this job fails the suite runs in full.
  changes:
    name: Detect E2E changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}

    steps:
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            e2e:
              - "**"
              - "!**/*.md"

  # Whether this run deploys a preview: the PRs Coolify builds previews for
  # itself (preview-deployment.yml's `if`): same-repo PRs from owners, members and
  # collaborators, not titled [skip ci] / [skip cd]. Fork PRs get no secrets,
  # and fork and Dependabot runs can't push to GHCR.
  preview:
    name: Plan preview
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
      tag: ${{ steps.plan.outputs.tag }}
      image: ${{ steps.plan.outputs.image }}
    steps:
      - id: plan
        env:
          DEPLOY: >-
            ${{
              github.event_name == 'pull_request' &&
              vars.COOLIFY_PREVIEW_IMAGE_APP_UUID != '' &&
              github.event.pull_request.head.repo.full_name == github.repository &&
              contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) &&
              !contains(github.event.pull_request.title, '[skip ci]') &&
              !contains(github.event.pull_request.title, '[skip cd]')
            }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "deploy=$DEPLOY" >> "$GITHUB_OUTPUT"
          if [ "$DEPLOY" = "true" ]; then
            echo "image=ghcr.io/${OWNER,,}/pragmatic-papers-preview" >> "$GITHUB_OUTPUT"
            echo "tag=pr-${PR}-${SHA::12}" >> "$GITHUB_OUTPUT"
          fi

  image:
    name: Build image
    needs: [changes, preview]
    if: ${{ !cancelled() && needs.preview.result == 'success' && (needs.preview.outputs.deploy == 'true' || github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.e2e == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    # What `next build` prerenders from. Nothing it reads ends up served: the
    # server throws the prerendered routes away once it runs on its own
    # database (dockerfiles/scripts/start.sh, and scripts/test-e2e.mjs here).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: build
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-app-image
        with:
          gh-font-read-token: ${{ secrets.GH_FONT_READ }}
          source-commit: ${{ github.event.pull_request.head.sha || github.sha }}
          push-tag: ${{ needs.preview.outputs.deploy == 'true' && format('{0}:{1}', needs.preview.outputs.image, needs.preview.outputs.tag) || '' }}
          registry-token: ${{ github.token }}

  # Hands the image E2E is testing to Coolify as the PR's preview, alongside
  # the tests rather than after them, as previews always have been. A new push
  # cancels this run (the workflow's concurrency group) before it can deploy
  # a stale image.
  deploy:
    name: Deploy preview
    needs: [preview, image]
    if: ${{ !cancelled() && needs.image.result == 'success' && needs.preview.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    # scripts/preview-deployment.ts waits on Coolify, first boot included
    # (copying staging).
    timeout-minutes: 45
    permissions:
      contents: read
      deployments: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/preview-deployment.ts
          sparse-checkout-cone-mode: false

      # Node 24 runs the TypeScript script directly; no install needed.
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      # A PR closed while this run was building has had its preview removed
      # (preview-image.yml); deploying now would bring it back.
      - name: Check the PR is still open
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: echo "state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .state)" >> "$GITHUB_OUTPUT"

      - name: Deploy to Coolify and mirror its status
        if: steps.open.outputs.state == 'open'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COOLIFY_DASHBOARD_URL: ${{ vars.COOLIFY_DASHBOARD_URL }}
          COOLIFY_PREVIEW_APP_UUID: ${{ vars.COOLIFY_PREVIEW_IMAGE_APP_UUID }}
          PREVIEW_URL_TEMPLATE: ${{ vars.PREVIEW_URL_TEMPLATE }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          TAG: ${{ needs.preview.outputs.tag }}
        run: node scripts/preview-deployment.ts deploy "$TAG"

  test:
    name: E2E tests
    needs: [changes, image]
    # Runs even when the image failed, so the failure lands on this required
    # check: a skipped required check counts as passing.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.e2e == 'true') }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # Pinned to the exact @playwright/test version resolved in
    # pnpm-lock.yaml so CI's chromium build matches what
    # `pnpm test:e2e:update-snapshots` runs locally (see
    # scripts/test-e2e-docker.ts) — both sides render identical baselines
    # instead of "hopefully close" bare-runner Chromium builds that can
    # drift as ubuntu-latest itself is updated. This pins the rendering
    # environment (Chromium + fonts) specifically — Node itself is only
    # matched at the major-version level (24.x) between this step's
    # setup-project action and the image's bundled Node, same as it always
    # was; screenshot pixels don't depend on the Node patch version.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble

    permissions:
      contents: write
      pull-requests: write
      checks: write

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Must match TEST_DATABASE_URI in .github/actions/setup-e2e.
          POSTGRES_DB: pragmatic-papers-e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Stop if the image didn't build
        if: needs.image.result != 'success'
        env:
          RESULT: ${{ needs.image.result }}
        run: |
          echo "::error::The Build image job ended with '$RESULT'; there's no image to test."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up E2E
        uses: ./.github/actions/setup-e2e
        with:
          gh-font-read-token: ${{ secrets.GH_FONT_READ }}
          # The job that saves the pnpm store for the Playwright image, which
          # the Storybook job in ci.yml also restores from.
          save-pnpm-cache: "true"

      # Captured before the later "Commit new snapshot baselines" step can
      # advance HEAD, so anything describing *this* test run (regression
      # artifacts) has a stable reference regardless of what gets pushed
      # afterward.
      - name: Record tested commit
        id: tested
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Only fills in baselines for tests that don't have one yet. Any test
      # with an existing baseline is still compared strictly and fails the
      # step on a mismatch.
      # E2E_VERIFY_VISUAL folds the flaky-baseline gate into this single run:
      # when a screenshot baseline is written/changed here, the wrapper
      # re-renders the @visual tests against the same server and fails if a
      # baseline only matches its own first render. It reuses the seeded,
      # built server (no re-seed, no rebuild) and no-ops when no baseline
      # changed — so PRs that touch no screenshots pay nothing.
      - name: Run Playwright tests
        id: e2e
        env:
          E2E_VERIFY_VISUAL: "true"
          # The image's server shares this container's network (scripts/test-e2e.mjs).
          E2E_NETWORK_CONTAINER: ${{ job.container.id }}
        run: pnpm test:e2e -- --update-snapshots=${{ github.event_name == 'merge_group' && 'none' || 'missing' }}

      # Runs even if the step above failed: a real regression on one test
      # shouldn't block committing a legitimately new baseline from another.
      # BUT skip when the @visual determinism gate failed — otherwise a flaky
      # new baseline would be committed and the step below would report
      # "E2E tests" green on the auto-commit sha, letting a nondeterministic
      # screenshot merge and defeating the gate. The wrapper sets
      # determinism_failed only for a gate failure, not the benign
      # "wrote a missing baseline" failure, so legitimate new baselines still
      # commit.
      # On a PR the checkout is GitHub's merge commit, and committing on top
      # of it would also merge the base branch into the PR. So only the added
      # baselines are committed, onto the PR's own head, through a separate
      # index that leaves this checkout as it was tested.
      - name: Commit new snapshot baselines
        id: commit
        if: ${{ !cancelled() && github.event_name != 'merge_group' && steps.e2e.outputs.determinism_failed != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PARENT_SHA: ${{ github.event.pull_request.head.sha || steps.tested.outputs.sha }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/__screenshots__
          added=$(git diff --cached --name-only --diff-filter=A)
          if [ -z "$added" ]; then
            echo "No new baselines to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export GIT_INDEX_FILE="$RUNNER_TEMP/baselines.index"
          git read-tree "$PARENT_SHA"
          echo "$added" | git update-index --add --stdin
          sha=$(git commit-tree "$(git write-tree)" -p "$PARENT_SHA" -m "test: add missing e2e snapshot baselines")
          git push origin "$sha:refs/heads/${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN start runs that wait for a maintainer's
      # approval, so the new commit would otherwise sit with no results. Writing
      # a missing baseline fails its test, so the step above always fails when
      # there's something to commit; the wrapper says when those writes were
      # its only failures. Then "E2E tests" is reported as passing on the new
      # commit, and the other checks are copied from its parent with their
      # real results (scripts/snapshot-commit-checks.ts). After a real failure
      # nothing is reported, and the approved runs decide.
      - name: Report CI checks on snapshot commit
        if: ${{ !cancelled() && steps.commit.outputs.committed == 'true' && steps.e2e.outputs.only_new_baselines_failed == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PARENT_SHA: ${{ github.event.pull_request.head.sha || steps.tested.outputs.sha }}
          HEAD_SHA: ${{ steps.commit.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/snapshot-commit-checks.ts

      - name: Post visual regression comment
        if: ${{ failure() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ASSET_DIR: ${{ github.event.pull_request.number }}/${{ steps.tested.outputs.sha }}/regressions
          MARKER: visual-regressions
          TITLE: Visual regressions detected
          COLUMNS_PER_ROW: "3"
          FOOTER: >-
            Columns per snapshot: **actual** / **diff** / **expected**. If
            this change is intentional, run the *Update snapshot baselines*
            workflow manually on this branch (or `gh workflow run
            update-snapshots.yml --ref ${{ github.head_ref }}`) to accept it.
            Otherwise, fix the regression and push.
        run: |
          find test-results -type f \
            \( -name '*-expected.png' -o -name '*-actual.png' -o -name '*-diff.png' \) \
            -not -path '*retry*' | sort \
            | pnpm exec tsx scripts/pr-screenshot-comment.ts

      - name: Clear stale visual regression comment
        if: ${{ success() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ASSET_DIR: unused
          MARKER: visual-regressions
          DELETE_WHEN_EMPTY: "true"
        run: pnpm exec tsx scripts/pr-screenshot-comment.ts </dev/null

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Post snapshot updates comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.base.ref != 'main' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DELETE_WHEN_EMPTY: "true"
        run: |
          # Use the actual current HEAD, not github.event.pull_request.head.sha —
          # if the earlier commit step pushed a new baseline commit, that event
          # context still points at the pre-commit sha and would upload assets
          # under the wrong (nonexistent-on-branch) path.
          ASSET_DIR="$PR_NUMBER/$(git rev-parse HEAD)"
          export ASSET_DIR
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git diff --name-only --diff-filter=AM \
            "origin/$BASE_REF...HEAD" -- '**/__screenshots__/**/*.png' \
            | pnpm exec tsx scripts/pr-screenshot-comment.ts

  # The client JavaScript and CSS each public page loads, read from the image's
  # build manifests (scripts/bundle-size.ts), compared with dev's last measurement.
  # A page whose JavaScript grew by more than 10 kB gets a warning; it never fails.
  # Pushes to dev upload the measurement PRs compare with.
  bundle-size:
    name: Bundle size
    needs: [changes, image]
    if: ${{ !cancelled() && needs.image.result == 'success' && ((github.event_name == 'pull_request' && (needs.changes.result != 'success' || needs.changes.outputs.e2e == 'true')) || (github.event_name == 'push' && github.ref == 'refs/heads/dev')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: "24.x"
          gh-font-read-token: ${{ secrets.GH_FONT_READ }}

      - name: Download the app image
        uses: actions/download-artifact@v7
        with:
          name: app-image
          path: ${{ runner.temp }}

      # The build the PR deploys, rather than a second `next build` here.
      - name: Copy the build out of the image
        run: |
          docker load -i "$RUNNER_TEMP/app-image.tar"
          id=$(docker create pragmatic-papers-app:ci)
          docker cp "$id:/app/.next" "$RUNNER_TEMP/next"
          docker rm "$id"

      - name: Download dev's measurement
        id: base
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/download-dev-artifact
        with:
          name: bundle-size

      - name: Measure and compare with dev
        env:
          BASE_BUNDLE_SIZE_PATH: ${{ steps.base.outputs.dir && format('{0}/bundle-size.json', steps.base.outputs.dir) || '' }}
          BUNDLE_SIZE_OUT: bundle-size.json
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: pnpm bundle-size --next-dir "$RUNNER_TEMP/next"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: bundle-size
          path: bundle-size.json
          retention-days: 90

  # Lighthouse's performance audit of a few seeded pages (scripts/lighthouse.ts),
  # compared with dev's last results. In its own job so the suite doesn't share the
  # runner's CPU with it. Report-only: it posts how each page compares with dev and
  # annotates big regressions, but never fails. Pushes to dev upload the results PRs
  # compare with.
  lighthouse:
    name: Lighthouse
    needs: [changes, image]
    if: ${{ !cancelled() && needs.image.result == 'success' && ((github.event_name == 'pull_request' && (needs.changes.result != 'success' || needs.changes.outputs.e2e == 'true')) || (github.event_name == 'push' && github.ref == 'refs/heads/dev')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The E2E job's container, for its Chromium and the shared setup-e2e action.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    permissions:
      actions: read
      contents: read
      pull-requests: write

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Must match TEST_DATABASE_URI in .github/actions/setup-e2e.
          POSTGRES_DB: pragmatic-papers-e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up E2E
        uses: ./.github/actions/setup-e2e
        with:
          gh-font-read-token: ${{ secrets.GH_FONT_READ }}

      - name: Download dev's results
        id: base
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/download-dev-artifact
        with:
          name: lighthouse-results

      # Seeds the database and starts the image as the E2E suite does, then runs
      # Lighthouse against it in place of Playwright.
      - name: Run Lighthouse
        env:
          E2E_COMMAND: pnpm exec tsx scripts/lighthouse.ts
          BASE_LIGHTHOUSE_PATH: ${{ steps.base.outputs.dir && format('{0}/summary.json', steps.base.outputs.dir) || '' }}
          E2E_NETWORK_CONTAINER: ${{ job.container.id }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-results
          path: lighthouse-results/
          retention-days: 90
