name: Playwright Tests

# Screenshot baseline lifecycle:
#   - Missing baselines (new screenshot tests) are generated automatically on
#     every PR/push run and committed straight to the branch — safe because
#     there's no existing baseline to regress against, and rendering is now
#     pinned (production server, fixed locale/timezone/color-scheme,
#     waitForStableRender) so they don't drift between runs.
#   - A mismatch against an EXISTING baseline fails the run and posts a
#     "Visual regressions detected" PR comment with actual/diff/expected
#     images — it is never auto-committed.
#   - To accept an intentional visual change, run the "Update snapshot
#     baselines" workflow manually on the branch (or `gh workflow run
#     update-snapshots.yml --ref <branch>` from a terminal — no browser
#     needed). It lives in its own workflow file (update-snapshots.yml) so it
#     doesn't show up as a permanently skipped check here.
on:
  push:
    branches: [main, dev]
  pull_request:

env:
  PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
  NEXT_PUBLIC_SERVER_URL: http://localhost:8000
  USE_LOCAL_STORAGE: "true"
  DATABASE_URI: postgres://postgres:postgres@localhost:5432/pragmatic-papers-e2e
  E2E_PROD_SERVER: "true"

jobs:
  test:
    name: E2E tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      checks: write

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pragmatic-papers-e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: "24.x"
          gh-font-read-token: ${{ secrets.GH_FONT_READ }}
          payload-secret: ${{ secrets.PAYLOAD_SECRET }}

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Only fills in baselines for tests that don't have one yet. Any test
      # with an existing baseline is still compared strictly and fails the
      # step on a mismatch.
      - name: Run Playwright tests
        run: pnpm test:e2e -- --update-snapshots=missing

      # Runs even if the step above failed: a real regression on one test
      # shouldn't block committing a legitimately new baseline from another.
      - name: Commit new snapshot baselines
        id: commit
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/__screenshots__
          if git diff --cached --quiet; then
            echo "No new baselines to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "test: add missing e2e snapshot baselines"
          git push origin "HEAD:${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN don't trigger workflows, so the new
      # commit would otherwise sit with no status checks and block merging.
      # This job already ran the full E2E suite against it, so report the
      # other required checks as passed on the new sha too.
      - name: Report CI checks on snapshot commit
        if: ${{ steps.commit.outputs.committed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_SHA=$(git rev-parse HEAD)
          for check_name in "Static checks" "Unit tests" "Integration tests"; do
            gh api repos/${{ github.repository }}/check-runs \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              -f name="$check_name" \
              -f head_sha="$NEW_SHA" \
              -f status=completed \
              -f conclusion=success \
              -f "output[title]=Skipped — snapshot-only commit" \
              -f "output[summary]=Only new PNG baselines were added. No code to check." \
              >/dev/null
          done

      - name: Post visual regression comment
        if: ${{ failure() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ASSET_DIR: ${{ github.event.pull_request.number }}/${{ github.event.pull_request.head.sha }}/regressions
          MARKER: visual-regressions
          TITLE: Visual regressions detected
          COLUMNS_PER_ROW: "3"
          FOOTER: >-
            Columns per snapshot: **actual** / **diff** / **expected**. If
            this change is intentional, run the *Update snapshot baselines*
            workflow manually on this branch (or `gh workflow run
            update-snapshots.yml --ref ${{ github.head_ref }}`) to accept it.
            Otherwise, fix the regression and push.
        run: |
          find test-results -type f \
            \( -name '*-expected.png' -o -name '*-actual.png' -o -name '*-diff.png' \) \
            -not -path '*retry*' | sort \
            | pnpm exec tsx scripts/pr-screenshot-comment.ts

      - name: Clear stale visual regression comment
        if: ${{ success() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ASSET_DIR: unused
          MARKER: visual-regressions
          DELETE_WHEN_EMPTY: "true"
        run: pnpm exec tsx scripts/pr-screenshot-comment.ts </dev/null

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Post snapshot updates comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.base.ref != 'main' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ASSET_DIR: ${{ github.event.pull_request.number }}/${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DELETE_WHEN_EMPTY: "true"
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git diff --name-only --diff-filter=AM \
            "origin/$BASE_REF...HEAD" -- '**/__screenshots__/**/*.png' \
            | pnpm exec tsx scripts/pr-screenshot-comment.ts
