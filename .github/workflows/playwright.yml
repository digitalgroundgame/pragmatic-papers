name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: E2E tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set Base URL
        id: set-url
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "base_url=https://pr-${{ github.event.number }}.pragmaticpapers.com" >> $GITHUB_OUTPUT
          else
            echo "base_url=https://staging.pragmaticpapers.com" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: "24.x"
          gh-font-read-token: ${{ secrets.GH_FONT_READ }}

      - name: Wait for Fresh Staging Deployment
        shell: bash
        run: |
          URL="${{ steps.set-url.outputs.base_url }}"
          EXPECTED_SHA="${{ github.sha }}"
          echo "Waiting for $URL to serve commit $EXPECTED_SHA..."

          # Wait up to 15 minutes (90 * 10s) - builds can take a while
          for i in {1..90}; do
            # Fetch headers, find x-current-commit, extract value, remove whitespace/CR
            # Use -L to follow redirects if necessary
            LIVE_SHA=$(curl -sI -L "$URL" | grep -i "x-current-commit" | awk '{print $2}' | tr -d '\r\n')
            
            if [ "$LIVE_SHA" == "$EXPECTED_SHA" ]; then
              echo "✅ Fresh deployment is live!"
              exit 0
            fi
            
            if [ -z "$LIVE_SHA" ]; then
              echo "⚠️ URL is not responding or header is missing. ($i/90)"
            else
              echo "⏳ Old deployment still active (Live: ${LIVE_SHA:0:7}, Expected: ${EXPECTED_SHA:0:7}). ($i/90)"
            fi
            
            sleep 10
          done

          echo "❌ Timed out waiting for fresh deployment on $URL"
          exit 1

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm exec playwright test --config=playwright.config.ts --project=chromium
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ steps.set-url.outputs.base_url }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
