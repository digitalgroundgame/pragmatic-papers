name: Playwright Tests

# Screenshot baseline lifecycle:
#   - Missing baselines (new screenshot tests) are generated automatically on
#     every PR/push run and committed straight to the branch — safe because
#     there's no existing baseline to regress against, and rendering is now
#     pinned (production server, fixed locale/timezone/color-scheme,
#     waitForStableRender) so they don't drift between runs.
#   - A mismatch against an EXISTING baseline fails the run and posts a
#     "Visual regressions detected" PR comment with actual/diff/expected
#     images — it is never auto-committed.
#   - To accept an intentional visual change, run the "Update snapshot
#     baselines" workflow manually on the branch (or `gh workflow run
#     update-snapshots.yml --ref <branch>` from a terminal — no browser
#     needed). It lives in its own workflow file (update-snapshots.yml) so it
#     doesn't show up as a permanently skipped check here.
on:
  push:
    branches: [main, dev]
  pull_request:

# Shared with update-snapshots.yml's group: both workflows can push a
# baseline commit to the same branch, so a stale run's push would otherwise
# race a newer one's. Cancelling the older run shrinks that race window from
# the whole E2E run down to GitHub's cancellation grace period — not a hard
# guarantee, but the practical case (two full runs finishing close together)
# can no longer happen.
concurrency:
  group: snapshot-baselines-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  PAYLOAD_SECRET: e2e-payload-secret
  NEXT_PUBLIC_SERVER_URL: http://localhost:8000
  USE_LOCAL_STORAGE: "true"
  # The Merch block has no built-in store site — without this it renders
  # nothing and merch.spec.ts has no carousel to exercise.
  MERCH_SITE_URL: https://digitalgroundgame.org/merch
  # Hostname is the services key ("postgres"), not localhost — the job runs
  # inside a container, and service containers are reachable by their
  # service-id alias on the shared Docker network, not via the runner's
  # loopback interface.
  DATABASE_URI: postgres://postgres:postgres@postgres:5432/pragmatic-papers-e2e
  E2E_PROD_SERVER: "true"

jobs:
  test:
    name: E2E tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # Pinned to the exact @playwright/test version resolved in
    # pnpm-lock.yaml so CI's chromium build matches what
    # `pnpm test:e2e:update-snapshots` runs locally (see
    # scripts/test-e2e-docker.ts) — both sides render identical baselines
    # instead of "hopefully close" bare-runner Chromium builds that can
    # drift as ubuntu-latest itself is updated. This pins the rendering
    # environment (Chromium + fonts) specifically — Node itself is only
    # matched at the major-version level (24.x) between this step's
    # setup-project action and the image's bundled Node, same as it always
    # was; screenshot pixels don't depend on the Node patch version.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble

    permissions:
      contents: write
      pull-requests: write
      checks: write

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pragmatic-papers-e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # actions/checkout's files are owned by a different UID than this
      # container's user, so git's dubious-ownership check blocks every git
      # command below unless the workspace is explicitly trusted.
      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The Playwright image doesn't ship the GitHub CLI, but several steps
      # below (committing baselines, posting PR comments via
      # scripts/pr-screenshot-comment.ts) shell out to `gh`. Pull the release
      # tarball straight from GitHub instead of going through the apt repo —
      # that path ran `apt-get update` twice (a full package-index rebuild
      # each time, ~20-40s) just to land one static binary. The pinned version
      # only needs to be recent enough for the `gh api`/`gh run`/`gh pr`
      # commands used here; bump freely.
      - name: Install GitHub CLI
        run: |
          GH_VERSION=2.63.2
          ARCH=$(dpkg --print-architecture)
          curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_${ARCH}.tar.gz" \
            | tar -xz -C /tmp
          install "/tmp/gh_${GH_VERSION}_linux_${ARCH}/bin/gh" /usr/local/bin/gh
          gh --version

      # Captured before the later "Commit new snapshot baselines" step can
      # advance HEAD, so anything describing *this* test run (regression
      # artifacts) has a stable reference regardless of what gets pushed
      # afterward.
      - name: Record tested commit
        id: tested
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: "24.x"
          gh-font-read-token: ${{ secrets.GH_FONT_READ }}
          payload-secret: ${{ env.PAYLOAD_SECRET }}

      # Restores Next.js incremental compilation cache so `next build` inside
      # the E2E run only recompiles what changed since the last run on this
      # branch (or dev).
      - name: Cache Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx', '*.[jt]s', '*.[jt]sx') }}
          restore-keys: |
            nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      # Only fills in baselines for tests that don't have one yet. Any test
      # with an existing baseline is still compared strictly and fails the
      # step on a mismatch.
      # E2E_VERIFY_VISUAL folds the flaky-baseline gate into this single run:
      # when a screenshot baseline is written/changed here, the wrapper
      # re-renders the @visual tests against the same server and fails if a
      # baseline only matches its own first render. It reuses the seeded,
      # built server (no re-seed, no rebuild) and no-ops when no baseline
      # changed — so PRs that touch no screenshots pay nothing.
      - name: Run Playwright tests
        id: e2e
        env:
          E2E_VERIFY_VISUAL: "true"
        run: pnpm test:e2e -- --update-snapshots=missing

      # Runs even if the step above failed: a real regression on one test
      # shouldn't block committing a legitimately new baseline from another.
      # BUT skip when the @visual determinism gate failed — otherwise a flaky
      # new baseline would be committed and the step below would report
      # "E2E tests" green on the auto-commit sha, letting a nondeterministic
      # screenshot merge and defeating the gate. The wrapper sets
      # determinism_failed only for a gate failure, not the benign
      # "wrote a missing baseline" failure, so legitimate new baselines still
      # commit.
      - name: Commit new snapshot baselines
        id: commit
        if: ${{ !cancelled() && steps.e2e.outputs.determinism_failed != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/__screenshots__
          if git diff --cached --quiet; then
            echo "No new baselines to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "test: add missing e2e snapshot baselines"
          git push origin "HEAD:${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN don't trigger workflows, so the new
      # commit would otherwise sit with no status checks and block merging.
      # This job already ran the full E2E suite against it, so report the
      # required checks — including "E2E tests" (this very job) — as passed on
      # the new sha too. Omitting "E2E tests" left the auto-commit with its
      # required E2E check unreported, so the PR stayed blocked / a run would
      # park in "action_required" until a maintainer approved it (matches
      # update-snapshots.yml, which already reports "E2E tests").
      - name: Report CI checks on snapshot commit
        if: ${{ steps.commit.outputs.committed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_SHA=$(git rev-parse HEAD)
          for check_name in "Static checks" "Unit tests" "Integration tests" "E2E tests"; do
            gh api repos/${{ github.repository }}/check-runs \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              -f name="$check_name" \
              -f head_sha="$NEW_SHA" \
              -f status=completed \
              -f conclusion=success \
              -f "output[title]=Skipped — snapshot-only commit" \
              -f "output[summary]=Only new PNG baselines were added. No code to check." \
              >/dev/null
          done

      - name: Post visual regression comment
        if: ${{ failure() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ASSET_DIR: ${{ github.event.pull_request.number }}/${{ steps.tested.outputs.sha }}/regressions
          MARKER: visual-regressions
          TITLE: Visual regressions detected
          COLUMNS_PER_ROW: "3"
          FOOTER: >-
            Columns per snapshot: **actual** / **diff** / **expected**. If
            this change is intentional, run the *Update snapshot baselines*
            workflow manually on this branch (or `gh workflow run
            update-snapshots.yml --ref ${{ github.head_ref }}`) to accept it.
            Otherwise, fix the regression and push.
        run: |
          find test-results -type f \
            \( -name '*-expected.png' -o -name '*-actual.png' -o -name '*-diff.png' \) \
            -not -path '*retry*' | sort \
            | pnpm exec tsx scripts/pr-screenshot-comment.ts

      - name: Clear stale visual regression comment
        if: ${{ success() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ASSET_DIR: unused
          MARKER: visual-regressions
          DELETE_WHEN_EMPTY: "true"
        run: pnpm exec tsx scripts/pr-screenshot-comment.ts </dev/null

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Post snapshot updates comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.base.ref != 'main' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DELETE_WHEN_EMPTY: "true"
        run: |
          # Use the actual current HEAD, not github.event.pull_request.head.sha —
          # if the earlier commit step pushed a new baseline commit, that event
          # context still points at the pre-commit sha and would upload assets
          # under the wrong (nonexistent-on-branch) path.
          export ASSET_DIR="$PR_NUMBER/$(git rev-parse HEAD)"
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git diff --name-only --diff-filter=AM \
            "origin/$BASE_REF...HEAD" -- '**/__screenshots__/**/*.png' \
            | pnpm exec tsx scripts/pr-screenshot-comment.ts
