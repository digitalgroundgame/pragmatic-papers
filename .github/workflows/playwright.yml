name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: E2E tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    env:
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      NEXT_PUBLIC_SERVER_URL: http://localhost:8000
      USE_LOCAL_STORAGE: "true"

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: "24.x"
          gh-font-read-token: ${{ secrets.GH_FONT_READ }}
          payload-secret: ${{ secrets.PAYLOAD_SECRET }}

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run Playwright tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload screenshots to PR comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          ASSETS_BRANCH: pr-screenshots
        run: |
          if [ ! -d screenshots ] || [ -z "$(ls screenshots/*.png 2>/dev/null)" ]; then
            echo "No screenshots found — skipping."
            exit 0
          fi

          # Stage screenshots in a worktree on an orphan assets branch
          # under <pr-number>/<sha>/, then push.
          asset_dir="$PR_NUMBER/$PR_SHA"
          mkdir -p /tmp/screenshots-stage
          cp screenshots/*.png /tmp/screenshots-stage/

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code origin "$ASSETS_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$ASSETS_BRANCH":"$ASSETS_BRANCH"
            git worktree add /tmp/assets "$ASSETS_BRANCH"
          else
            git worktree add --detach /tmp/assets
            git -C /tmp/assets checkout --orphan "$ASSETS_BRANCH"
            git -C /tmp/assets rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p "/tmp/assets/$asset_dir"
          cp /tmp/screenshots-stage/*.png "/tmp/assets/$asset_dir/"
          git -C /tmp/assets add "$asset_dir"
          git -C /tmp/assets commit -m "screenshots: PR #$PR_NUMBER @ $PR_SHA"
          git -C /tmp/assets push origin "$ASSETS_BRANCH"

          images=""
          for f in /tmp/screenshots-stage/*.png; do
            name=$(basename "$f" .png)
            url="https://raw.githubusercontent.com/$OWNER/$REPO/$ASSETS_BRANCH/$asset_dir/$name.png"
            images="$images\n**$name**\n![$name]($url)\n"
          done

          body="<!-- screenshots -->
          ## Screenshots
          $(printf '%b' "$images")"

          comment_id=$(gh api "repos/$OWNER/$REPO/issues/$PR_NUMBER/comments" \
            --jq '[.[] | select(.body | startswith("<!-- screenshots -->"))] | first | .id // empty')

          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$OWNER/$REPO/issues/comments/$comment_id" \
              -f body="$body"
            echo "Screenshots comment updated on PR #$PR_NUMBER."
          else
            gh pr comment "$PR_NUMBER" --body "$body"
            echo "Screenshots comment posted on PR #$PR_NUMBER."
          fi
