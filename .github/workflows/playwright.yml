name: Playwright Tests

on:
  repository_dispatch:
    types: [coolify-deploy-success]
  workflow_dispatch:
    inputs:
      url:
        description: "URL to test (e.g., https://staging.pragmaticpapers.com)"
        required: true
        default: "https://staging.pragmaticpapers.com"

jobs:
  test:
    name: E2E tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set Base URL
        id: set-url
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "base_url=${{ github.event.client_payload.url }}" >> $GITHUB_OUTPUT
          else
            echo "base_url=${{ github.event.inputs.url }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: "24.x"
          gh-font-read-token: ${{ secrets.GH_FONT_READ }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm exec playwright test --config=playwright.config.ts --project=chromium
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ steps.set-url.outputs.base_url }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
