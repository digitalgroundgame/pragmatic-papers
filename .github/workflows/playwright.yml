name: Playwright Tests

# Screenshot baseline lifecycle:
#   - Baselines live in tests/e2e/__screenshots__ and are ONLY ever generated
#     by the "Update snapshot baselines" job below (Linux chromium, production
#     server) — never locally and never as a side effect of a PR test run.
#   - PR/push runs compare strictly. A missing baseline or a visual diff fails
#     the run and posts a "Visual regressions detected" comment with the
#     actual/diff images.
#   - To accept changes (or add baselines for new tests), run this workflow
#     via workflow_dispatch on the PR branch: mode "missing" only adds
#     baselines for new tests, mode "all" rewrites every baseline.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Which snapshot baselines to regenerate and commit"
        type: choice
        options: [missing, all]
        default: missing

env:
  PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
  NEXT_PUBLIC_SERVER_URL: http://localhost:8000
  USE_LOCAL_STORAGE: "true"
  DATABASE_URI: postgres://postgres:postgres@localhost:5432/pragmatic-papers-e2e
  E2E_PROD_SERVER: "true"

jobs:
  test:
    name: E2E tests
    if: ${{ github.event_name != 'workflow_dispatch' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pragmatic-papers-e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: "24.x"
          gh-font-read-token: ${{ secrets.GH_FONT_READ }}
          payload-secret: ${{ secrets.PAYLOAD_SECRET }}

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm test:e2e

      - name: Post visual regression comment
        if: ${{ failure() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ASSET_DIR: ${{ github.event.pull_request.number }}/${{ github.event.pull_request.head.sha }}/regressions
          MARKER: visual-regressions
          TITLE: Visual regressions detected
          COLUMNS_PER_ROW: "3"
          FOOTER: >-
            Columns per snapshot: **actual** / **diff** / **expected** (new
            tests have no diff/expected yet). If these changes are intentional,
            run the *Playwright Tests* workflow manually on this branch with
            mode `all` (or `missing` to only add baselines for new tests) to
            regenerate and commit the baselines. Otherwise, fix the regression
            and push.
        run: |
          find test-results -type f \
            \( -name '*-expected.png' -o -name '*-actual.png' -o -name '*-diff.png' \) \
            -not -path '*retry*' | sort \
            | pnpm exec tsx scripts/pr-screenshot-comment.ts

      - name: Clear stale visual regression comment
        if: ${{ success() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ASSET_DIR: unused
          MARKER: visual-regressions
          DELETE_WHEN_EMPTY: "true"
        run: pnpm exec tsx scripts/pr-screenshot-comment.ts </dev/null

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Post snapshot updates comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.base.ref != 'main' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ASSET_DIR: ${{ github.event.pull_request.number }}/${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DELETE_WHEN_EMPTY: "true"
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git diff --name-only --diff-filter=AM \
            "origin/$BASE_REF...HEAD" -- '**/__screenshots__/**/*.png' \
            | pnpm exec tsx scripts/pr-screenshot-comment.ts

  update-snapshots:
    name: Update snapshot baselines
    if: ${{ github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      checks: write

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pragmatic-papers-e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: "24.x"
          gh-font-read-token: ${{ secrets.GH_FONT_READ }}
          payload-secret: ${{ secrets.PAYLOAD_SECRET }}

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Regenerate snapshot baselines (${{ inputs.update_snapshots }})
        run: pnpm test:e2e -- --update-snapshots=${{ inputs.update_snapshots }} --project=chromium

      - name: Commit regenerated snapshots
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/__screenshots__
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "test: update e2e snapshot baselines (${{ inputs.update_snapshots }})"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN don't trigger workflows, so the snapshot
      # commit would otherwise sit with no checks and block merging. The commit
      # only touches PNGs and this job just ran the E2E suite against them, so
      # report all required checks as passed on the new sha.
      - name: Report CI checks on snapshot commit
        if: ${{ steps.commit.outputs.committed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_SHA=$(git rev-parse HEAD)
          for check_name in "Static checks" "Unit tests" "Integration tests" "E2E tests"; do
            gh api repos/${{ github.repository }}/check-runs \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              -f name="$check_name" \
              -f head_sha="$NEW_SHA" \
              -f status=completed \
              -f conclusion=success \
              -f "output[title]=Snapshot-only commit" \
              -f "output[summary]=Only PNG baselines changed; generated and verified by the update-snapshots job." \
              >/dev/null
          done

      - name: Post snapshot updates comment
        if: ${{ steps.commit.outputs.committed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          pr=$(gh pr list --repo "$OWNER/$REPO" --head "$GITHUB_REF_NAME" \
            --state open --json number,baseRefName \
            --jq 'first | @json' || true)
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            echo "No open PR for $GITHUB_REF_NAME — skipping comment."
            exit 0
          fi
          PR_NUMBER=$(printf '%s' "$pr" | jq -r .number)
          BASE_REF=$(printf '%s' "$pr" | jq -r .baseRefName)
          export PR_NUMBER
          export ASSET_DIR="$PR_NUMBER/$(git rev-parse HEAD)"
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git diff --name-only --diff-filter=AM \
            "origin/$BASE_REF...HEAD" -- '**/__screenshots__/**/*.png' \
            | pnpm exec tsx scripts/pr-screenshot-comment.ts

      - name: Delete stale visual regression comment
        if: ${{ steps.commit.outputs.committed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          MARKER: visual-regressions
          ASSET_DIR: unused
          DELETE_WHEN_EMPTY: "true"
        run: |
          pr=$(gh pr list --repo "$OWNER/$REPO" --head "$GITHUB_REF_NAME" \
            --state open --json number --jq 'first | .number' || true)
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            exit 0
          fi
          PR_NUMBER="$pr" pnpm exec tsx scripts/pr-screenshot-comment.ts </dev/null

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
