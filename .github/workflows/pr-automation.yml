name: PR automation

# Everything a PR's labels and description start, in one job. GitHub has no
# way to start a workflow on one label only, so a workflow per label shows a
# skipped check for every other label added; this shows one "PR automation"
# check that passes. Work that takes longer runs in its own workflow, which
# this starts with workflow_dispatch:
#
#   - The "needs screenshots" label runs update-snapshots.yml on the PR's
#     branch, which takes the label off when it finishes.
#   - The "ready for review" label, or marking a PR that has it ready, runs
#     claude-review.yml on the PR's branch (PRs into dev, not drafts).
#   - Opening the PR, editing its description, or adding or removing the
#     "showcase" label syncs the label and the Showcase line
#     (scripts/showcase-pr.ts), and when that says to push, runs showcase.yml
#     from the default branch for the PR (see that file).
#
# Fork PRs get a read-only token and no secrets, so this skips them.
on:
  pull_request:
    types: [opened, edited, labeled, unlabeled, ready_for_review]

concurrency:
  group: pr-automation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  route:
    name: PR automation
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # workflow_dispatch.
      actions: write
      contents: read
      # The showcase label.
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}

    steps:
      - name: Regenerate screenshot baselines
        if: github.event.action == 'labeled' && github.event.label.name == 'needs screenshots'
        run: gh workflow run update-snapshots.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"

      - name: Start a Claude review
        if: >-
          github.event.pull_request.base.ref == 'dev' &&
          !github.event.pull_request.draft && (
            github.event.action == 'labeled' && github.event.label.name == 'ready for review' ||
            github.event.action == 'ready_for_review' && contains(github.event.pull_request.labels.*.name, 'ready for review')
          )
        run: gh workflow run claude-review.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF" -f pr="$PR_NUMBER"

      - name: Check whether the showcase needs a sync
        id: showcase
        if: >-
          github.event.action == 'opened' ||
          github.event.action == 'edited' && github.event.changes.body ||
          github.event.label.name == 'showcase'
        run: echo "sync=true" >> "$GITHUB_OUTPUT"

      # The script from the PR's head, not its test merge.
      - uses: actions/checkout@v7
        if: steps.showcase.outputs.sync
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: scripts/showcase-pr.ts
          sparse-checkout-cone-mode: false

      # Node 24 runs the TypeScript script directly; no install needed.
      - uses: actions/setup-node@v7
        if: steps.showcase.outputs.sync
        with:
          node-version: "24.x"

      - name: Sync the showcase label and the Showcase line
        id: sync
        if: steps.showcase.outputs.sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACTION: ${{ github.event.action }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'showcase') }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: node scripts/showcase-pr.ts sync

      # From the default branch, as showcase.yml's workflow_run trigger runs:
      # it checks out the PR's code itself, only for this repository's PRs.
      - name: Push showcase articles
        if: steps.sync.outputs.push == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run showcase.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" -f target="$PR_NUMBER"
