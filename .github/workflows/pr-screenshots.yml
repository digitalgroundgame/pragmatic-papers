name: PR Screenshots

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  screenshots:
    name: Capture and attach screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      pull-requests: write

    env:
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      USE_LOCAL_STORAGE: "true"
      SEED_E2E: "true"

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: "24.x"
          gh-font-read-token: ${{ secrets.GH_FONT_READ }}
          payload-secret: ${{ secrets.PAYLOAD_SECRET }}

      - name: Check for page.screenshot() in changed e2e tests
        id: check-screenshots
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          changed=$(git diff origin/${{ github.base_ref }}...HEAD --name-only -- 'tests/e2e/')
          if [ -z "$changed" ]; then
            echo "No e2e test files changed."
            echo "has_screenshots=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$changed" | xargs grep -ql "page\.screenshot("; then
            echo "has_screenshots=true" >> "$GITHUB_OUTPUT"
          else
            echo "No page.screenshot() calls found in changed e2e files."
            echo "has_screenshots=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Playwright browsers
        if: steps.check-screenshots.outputs.has_screenshots == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright (chromium only)
        if: steps.check-screenshots.outputs.has_screenshots == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests
        if: steps.check-screenshots.outputs.has_screenshots == 'true'
        run: pnpm test:e2e --project=chromium

      - name: Upload screenshots to PR description
        if: steps.check-screenshots.outputs.has_screenshots == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          # Skip if no screenshots were produced
          if [ ! -d screenshots ] || [ -z "$(ls screenshots/*.png 2>/dev/null)" ]; then
            echo "No screenshots found — skipping PR update."
            exit 0
          fi

          # Skip if the PR description already has the screenshots marker (idempotency)
          existing=$(gh pr view "$PR_NUMBER" --json body --jq '.body')
          if echo "$existing" | grep -q "<!-- screenshots -->"; then
            echo "Screenshots section already present — skipping."
            exit 0
          fi

          # Upload each PNG and collect image markdown
          images=""
          for f in screenshots/*.png; do
            name=$(basename "$f" .png)
            url=$(gh api --method POST \
              -H "Content-Type: image/png" \
              -H "Accept: application/vnd.github+json" \
              "https://uploads.github.com/repos/$OWNER/$REPO/issues/$PR_NUMBER/assets?name=$name.png" \
              --input "$f" \
              --jq '.url')
            images="$images\n**$name**\n![$name]($url)\n"
          done

          # Prepend the screenshots block to the existing PR body
          new_body="<!-- screenshots -->
          ## Screenshots
          $(printf '%b' "$images")
          ---

          $existing"

          gh pr edit "$PR_NUMBER" --body "$new_body"
          echo "Screenshots attached to PR #$PR_NUMBER."
