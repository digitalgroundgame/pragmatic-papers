name: Release train

# Cuts a release candidate every Tuesday and promotes it on Saturday
# (scripts/release-train.ts has the details):
#
#   - Tuesday: "Bump package.json to vX.Y.Z" into dev, the next candidate, with
#     the version worked out from the commit subjects since the last one. It
#     goes through review and the merge queue like any PR. Merge it by
#     Wednesday 16:00 UTC for it to go out that Saturday.
#   - Saturday: "Release X.Y.Z" into main, from a branch at the candidate's
#     bump commit, once it has been on dev for SOAK_DAYS (3). Merge it with a
#     merge commit, as release PRs always have been; release.yml then tags and
#     releases it.
#
# After a hotfix (`pnpm hotfix`), a candidate cut before it conflicts with
# main: the run closes its release PR and cuts nothing until the hotfix is
# back-merged into dev (a trial merge with `git merge-tree` decides).
#
# Nothing merges itself: both PRs wait on a person. Articles publish on
# Mondays, so a Saturday release leaves Sunday as a grace period, with
# volunteers around to triage. Holding a release is closing its PR; next
# week's run offers a newer one.
#
# Run it by hand with dry_run to see what it would do; by hand, step "all"
# cuts and promotes in one run. To ship a fix that landed after the candidate
# without waiting a week, run it with soak_days: 0 to cut a candidate that
# includes the fix, merge that bump PR, and run it again with soak_days: 0 to
# open its release PR (closing the older one).
#
# AUTHENTICATION
# --------------
# CI doesn't run on PRs opened with the workflow's own token, and both PRs
# need it, so this uses one of:
#   1. GitHub App (recommended): variable RELEASE_APP_ID and secret
#      RELEASE_APP_PRIVATE_KEY (the full .pem). The App needs Repository →
#      Contents: Read and write, and Pull requests: Read and write. It can be
#      the Projects App with those permissions added.
#   2. PAT fallback: secret RELEASE_TOKEN, fine-grained, with the same two
#      permissions on this repository.
on:
  schedule:
    # 16:00 UTC: 9am Pacific (8am in winter). The step job maps each to its step.
    - cron: "0 16 * * 2" # Tuesday: cut
    - cron: "0 16 * * 6" # Saturday: promote
  workflow_dispatch:
    inputs:
      step:
        description: Which step to take
        type: choice
        options: [all, cut, promote]
        default: all
      soak_days:
        description: Days a candidate must spend on dev before it's promoted
        default: "3"
      dry_run:
        description: Report the plan without opening or changing any PR
        type: boolean
        default: false

concurrency:
  group: release-train
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  train:
    name: Cut or promote
    runs-on: ubuntu-latest

    steps:
      - name: Generate App token
        id: app-token
        if: ${{ vars.RELEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # Every branch's history (origin/dev and origin/main), to find the
      # candidates and what each holds.
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      # Node 24 runs the TypeScript directly; no install needed.
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Run the train
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_TOKEN }}
          SOAK_DAYS: ${{ inputs.soak_days }}
          TRAIN_STEP: ${{ github.event.schedule == '0 16 * * 2' && 'cut' || github.event.schedule == '0 16 * * 6' && 'promote' || inputs.step }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -z "$GITHUB_TOKEN" ] && [ "$DRY_RUN" != "true" ]; then
            echo "::error::No token to open PRs with. Configure a GitHub App (RELEASE_APP_ID + RELEASE_APP_PRIVATE_KEY) or a RELEASE_TOKEN PAT; see the header of this workflow."
            exit 1
          fi
          node scripts/release-train.ts
