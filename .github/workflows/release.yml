name: Release

# Tags and releases each version that lands on main. When that version is a
# hotfix (`pnpm hotfix`), it also opens the PR that back-merges main into dev,
# which the release train waits on before it cuts another candidate. A person
# still merges it, by hand with the ruleset bypass rather than through dev's
# merge queue, because the queue squashes. It has to be a merge commit: a
# squash leaves dev's merge base with main behind the hotfix, so a later dev
# change to the same lines reads as a conflict here and in the release train.
#
# The back-merge PR needs the same token as the release train (a GitHub App or
# RELEASE_TOKEN; see release-train.yml), because CI doesn't run on PRs opened
# with the workflow's own token. Without one it warns and skips.

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      bumped: ${{ steps.version.outputs.bumped }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check for version bump
        id: version
        run: |
          CURRENT=$(jq -r .version package.json)
          PREVIOUS=$(git show HEAD~1:package.json 2>/dev/null | jq -r .version || echo "")
          echo "tag=v$CURRENT" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: steps.version.outputs.bumped == 'true'
        run: gh release create "${{ steps.version.outputs.tag }}" --target main --title "${{ steps.version.outputs.tag }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  back-merge:
    name: Open the back-merge PR
    needs: release
    if: needs.release.outputs.bumped == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Get the release App's token
        id: app-token
        if: ${{ vars.RELEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      # From main itself: a manual run is dispatched on dev by default, where
      # the release job reads dev's version.
      - name: Read main's version
        id: version
        run: echo "tag=v$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      # A release train merge brings main nothing dev lacks, so a trial merge of
      # main into dev leaves dev's tree as it is. A hotfix changes it, or
      # conflicts (merge-tree exits 1), and either way dev needs main.
      - name: Check whether dev already has main
        id: check
        run: |
          DEV_TREE=$(git rev-parse 'origin/dev^{tree}')
          if MERGED_TREE=$(git merge-tree --write-tree origin/dev origin/main) && [ "$MERGED_TREE" = "$DEV_TREE" ]; then
            echo "dev already has everything on main; nothing to back-merge."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      # Same branch and title as `pnpm hotfix <version> --phase 2`, so either
      # one reuses what the other opened.
      - name: Open the PR
        if: steps.check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::main has changes dev lacks, but there is no release token to open the back-merge PR with. Run \`pnpm hotfix ${TAG#v} --phase 2\`."
            exit 0
          fi
          BRANCH="chore/back-merge-$TAG"
          EXISTING=$(gh pr list --head "$BRANCH" --base dev --state open --json url --jq '.[0].url')
          if [ -n "$EXISTING" ]; then
            echo "Back-merge PR already open: $EXISTING"
            exit 0
          fi
          # Through the refs API, as the release train makes its branches: a git
          # push of main could carry workflow changes, which the token has no
          # permission to push.
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "Reusing $BRANCH"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/heads/$BRANCH" -f "sha=$(git rev-parse origin/main)" > /dev/null
          fi
          cat > "$RUNNER_TEMP/body.md" <<EOF
          $TAG reached main as a hotfix, so dev doesn't have it yet. The release train cuts no new candidate until it does.

          **Merge this by hand with a merge commit, using the ruleset bypass.** Don't add it to the merge queue or enable auto-merge, because the queue squashes, and don't use "Update branch". A squash gives dev the change under a different commit, so dev's merge base with main stays behind the hotfix and later changes to the same lines read as conflicts.

          If GitHub reports conflicts, resolve them on this branch with a merge commit (\`git merge origin/dev\`), never a rebase.
          EOF
          URL=$(gh pr create --base dev --head "$BRANCH" --title "Back-merge $TAG into dev" --body-file "$RUNNER_TEMP/body.md")
          echo "Opened $URL"
          echo "Back-merge PR: $URL" >> "$GITHUB_STEP_SUMMARY"
