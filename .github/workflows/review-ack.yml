name: Review acknowledgement

# Required on dev as the "Review acknowledged" check, recorded as a commit
# status on the PR's head commit by either of two paths:
#
# - Approval: a person with write access approves the PR's head commit with a
#   GitHub review. For someone else's PR; no Claude review needed.
# - Acknowledgement: a person with write access replies `/reviewed` on the PR
#   once a Claude review has run on it (claude-review.yml) and they've read it
#   and dealt with what it found. For your own PR, which GitHub won't let you
#   approve. The review can be of an earlier commit, so fixing its findings
#   needs no second review.
#
# Either way the status belongs to one commit, so a push afterwards needs a
# new approval or reply.
#
# A reply, not a 👍: GitHub sends workflows no event for reactions, so a
# reaction could only be picked up by polling.
#
# Agents must never post `/reviewed` or approve: both stand for a person
# having read the change. Comments and reviews carrying the Claude Code footer
# are ignored for that reason.
on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  merge_group:

jobs:
  record:
    name: Record acknowledgement
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/reviewed')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
      COMMENT_AT: ${{ github.event.comment.created_at }}
      COMMENTER: ${{ github.event.comment.user.login }}
      COMMENTER_TYPE: ${{ github.event.comment.user.type }}
      BODY: ${{ github.event.comment.body }}

    steps:
      - name: Check the commenter and the review
        id: check
        run: |
          fail() {
            echo "::error::$1"
            gh api -X POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=confused >/dev/null
            exit 1
          }

          [ "$COMMENTER_TYPE" = "User" ] || fail "$COMMENTER is not a person."
          case "$BODY" in
            *"Generated by [Claude Code]"*) fail "Agent-posted comments can't acknowledge a review." ;;
          esac
          permission=$(gh api "repos/$REPO/collaborators/$COMMENTER/permission" --jq .permission)
          case "$permission" in
            admin | maintain | write) ;;
            *) fail "$COMMENTER doesn't have write access." ;;
          esac

          head_sha=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)
          # The latest Claude review summary on the PR, of any commit, which
          # must predate this reply.
          reviewed_at=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "claude[bot]")
                      | select(.body | contains("<!-- claude-review sha="))
                      | .created_at' | tail -n 1)
          [ -n "$reviewed_at" ] || fail "No Claude review on this PR yet. Add the \"in review\" label, or wait for the review to finish."
          [[ "$reviewed_at" < "$COMMENT_AT" ]] || fail "The latest review was posted after this reply. Read it and reply again."

          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Record the status
        env:
          HEAD_SHA: ${{ steps.check.outputs.head_sha }}
        run: |
          gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" \
            -f state=success \
            -f context="Review acknowledged" \
            -f description="Acknowledged by $COMMENTER" >/dev/null
          gh api -X POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=+1 >/dev/null

  approval:
    name: Record approval
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' &&
      github.event.pull_request.base.ref == 'dev'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REVIEWED_SHA: ${{ github.event.review.commit_id }}
      REVIEWER: ${{ github.event.review.user.login }}
      REVIEWER_TYPE: ${{ github.event.review.user.type }}
      BODY: ${{ github.event.review.body }}

    steps:
      # GitHub already refuses approvals from the PR's author.
      - name: Check the reviewer and the commit
        run: |
          fail() {
            echo "::error::$1"
            exit 1
          }

          [ "$REVIEWER_TYPE" = "User" ] || fail "$REVIEWER is not a person."
          case "$BODY" in
            *"Generated by [Claude Code]"*) fail "Agent-submitted reviews can't approve." ;;
          esac
          permission=$(gh api "repos/$REPO/collaborators/$REVIEWER/permission" --jq .permission)
          case "$permission" in
            admin | maintain | write) ;;
            *) fail "$REVIEWER doesn't have write access." ;;
          esac
          head_sha=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)
          [ "$REVIEWED_SHA" = "$head_sha" ] || fail "The approval is of $REVIEWED_SHA, but the PR's head is now $head_sha."

      - name: Record the status
        run: |
          gh api -X POST "repos/$REPO/statuses/$REVIEWED_SHA" \
            -f state=success \
            -f context="Review acknowledged" \
            -f description="Approved by $REVIEWER" >/dev/null

  # The queue branch holds only commits whose PR head was acknowledged.
  queue:
    name: Review acknowledged
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Acknowledged on the pull request."
