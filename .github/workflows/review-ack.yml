name: Review acknowledgement

# Required on dev as the "Review acknowledged" check, recorded as a commit
# status on the PR's head commit by either of two paths:
#
# - Approval: a person with write access approves the PR's head commit with a
#   GitHub review. For someone else's PR; no Claude review needed.
# - Acknowledgement: a person with write access replies `/reviewed` or `LGTM`
#   (any case; startsWith() ignores it) on the PR
#   once a Claude review is on it and they've read it and dealt with what it
#   found. For your own PR, which GitHub won't let you approve. The review can
#   be of an earlier commit, so fixing its findings needs no second review.
#   It counts from either place a review comes from: CI (claude-review.yml,
#   posted by claude[bot]) or a local `/code-review --comment <pr>`, posted as
#   whoever ran it, which counts when they have write access. Either way it's
#   the summary comment ending in the `<!-- claude-review sha=… -->` marker.
#
# Either way the status belongs to one commit, so a push afterwards needs a
# new approval or reply.
#
# A reply, not a 👍: GitHub sends workflows no event for reactions, so a
# reaction could only be picked up by polling.
#
# Agents must never post `/reviewed` or `LGTM`, or approve: all stand for a person
# having read the change. Comments and reviews carrying the Claude Code footer
# are ignored for that reason.
#
# The paths live in separate workflows (this one for `/reviewed` and `LGTM`,
# review-approval.yml for approvals, review-queue.yml for the merge queue).
# A job whose `if` is false still reports "skipped" on the commit its event
# belongs to, and a required check counts "skipped" as passing: in one
# workflow, every comment-only review put a skipped "Review acknowledged" on
# the PR's head and satisfied the gate. So no job here is ever named
# "Review acknowledged", and each workflow listens only for its own event.
# (issue_comment runs belong to the default branch, not the PR.)
on:
  issue_comment:
    types: [created]

jobs:
  record:
    name: Record acknowledgement
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '/reviewed') ||
      startsWith(github.event.comment.body, 'LGTM'))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
      COMMENT_AT: ${{ github.event.comment.created_at }}
      COMMENTER: ${{ github.event.comment.user.login }}
      COMMENTER_TYPE: ${{ github.event.comment.user.type }}
      BODY: ${{ github.event.comment.body }}

    steps:
      - name: Check the commenter and the review
        id: check
        run: |
          fail() {
            echo "::error::$1"
            gh api -X POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=confused >/dev/null
            exit 1
          }

          [ "$COMMENTER_TYPE" = "User" ] || fail "$COMMENTER is not a person."
          case "$BODY" in
            *"Generated by [Claude Code]"* | *"Generated with [Claude Code]"*) fail "Agent-posted comments can't acknowledge a review." ;;
          esac
          permission=$(gh api "repos/$REPO/collaborators/$COMMENTER/permission" --jq .permission)
          case "$permission" in
            admin | maintain | write) ;;
            *) fail "$COMMENTER doesn't have write access." ;;
          esac

          head_sha=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)
          # The latest Claude review summary on the PR, of any commit, which
          # must predate this reply: CI's (claude[bot]), or a local
          # `/code-review --comment` run by someone with write access. A
          # summary ends with its full marker, so a comment quoting one
          # doesn't count.
          reviewed_at=
          while read -r author at; do
            if [ "$author" = "claude[bot]" ]; then
              reviewed_at=$at
              break
            fi
            case "$(gh api "repos/$REPO/collaborators/$author/permission" --jq .permission 2>/dev/null)" in
              admin | maintain | write)
                reviewed_at=$at
                break
                ;;
            esac
          done < <(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | test("<!-- claude-review sha=[0-9a-f]{40} verdict=[a-z]+ -->\\s*$"))
                      | "\(.user.login) \(.created_at)"' | tac)
          [ -n "$reviewed_at" ] || fail "No Claude review on this PR yet. Add the \"ready for review\" label, or run \`/code-review --comment <pr>\` locally."
          [[ "$reviewed_at" < "$COMMENT_AT" ]] || fail "The latest review was posted after this reply. Read it and reply again."

          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Record the status
        env:
          HEAD_SHA: ${{ steps.check.outputs.head_sha }}
        run: |
          gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" \
            -f state=success \
            -f context="Review acknowledged" \
            -f description="Acknowledged by $COMMENTER" >/dev/null
          gh api -X POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=+1 >/dev/null
