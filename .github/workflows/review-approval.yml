name: Review approval

# The approval path of the "Review acknowledged" check; see review-ack.yml.
# Every review submitted on a PR runs this, and anything but an approval
# leaves "Record approval" skipped on the PR's head. That name isn't the
# required check's, so a skip here can't satisfy the gate.
on:
  pull_request_review:
    types: [submitted]

jobs:
  approval:
    name: Record approval
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' &&
      github.event.pull_request.base.ref == 'dev'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REVIEWED_SHA: ${{ github.event.review.commit_id }}
      REVIEWER: ${{ github.event.review.user.login }}
      REVIEWER_TYPE: ${{ github.event.review.user.type }}
      BODY: ${{ github.event.review.body }}

    steps:
      # GitHub already refuses approvals from the PR's author.
      - name: Check the reviewer and the commit
        run: |
          fail() {
            echo "::error::$1"
            exit 1
          }

          [ "$REVIEWER_TYPE" = "User" ] || fail "$REVIEWER is not a person."
          case "$BODY" in
            *"Generated by [Claude Code]"* | *"Generated with [Claude Code]"*) fail "Agent-submitted reviews can't approve." ;;
          esac
          permission=$(gh api "repos/$REPO/collaborators/$REVIEWER/permission" --jq .permission)
          case "$permission" in
            admin | maintain | write) ;;
            *) fail "$REVIEWER doesn't have write access." ;;
          esac
          head_sha=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)
          [ "$REVIEWED_SHA" = "$head_sha" ] || fail "The approval is of $REVIEWED_SHA, but the PR's head is now $head_sha."

      - name: Record the status
        run: |
          gh api -X POST "repos/$REPO/statuses/$REVIEWED_SHA" \
            -f state=success \
            -f context="Review acknowledged" \
            -f description="Approved by $REVIEWER" >/dev/null
