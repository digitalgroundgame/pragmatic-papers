name: Update snapshot baselines

# Manual escape hatch for accepting an intentional visual change (see
# tests/e2e/README.md). Kept in its own workflow file — a job that's only
# ever meant to run on workflow_dispatch would otherwise show up as a
# permanently "skipped" check on every regular PR/push run of Playwright
# Tests.
on:
  workflow_dispatch:

env:
  PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
  NEXT_PUBLIC_SERVER_URL: http://localhost:8000
  USE_LOCAL_STORAGE: "true"
  DATABASE_URI: postgres://postgres:postgres@localhost:5432/pragmatic-papers-e2e
  E2E_PROD_SERVER: "true"

jobs:
  update-snapshots:
    name: Update snapshot baselines
    timeout-minutes: 60
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      checks: write

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pragmatic-papers-e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: "24.x"
          gh-font-read-token: ${{ secrets.GH_FONT_READ }}
          payload-secret: ${{ secrets.PAYLOAD_SECRET }}

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Cache Next.js build cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Regenerate every snapshot baseline
        run: pnpm test:e2e -- --update-snapshots=all --project=chromium

      - name: Commit regenerated snapshots
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/__screenshots__
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "test: update e2e snapshot baselines"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN don't trigger workflows, so the snapshot
      # commit would otherwise sit with no checks and block merging. The commit
      # only touches PNGs and this job just ran the E2E suite against them, so
      # report all required checks as passed on the new sha.
      - name: Report CI checks on snapshot commit
        if: ${{ steps.commit.outputs.committed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_SHA=$(git rev-parse HEAD)
          for check_name in "Static checks" "Unit tests" "Integration tests" "E2E tests"; do
            gh api repos/${{ github.repository }}/check-runs \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              -f name="$check_name" \
              -f head_sha="$NEW_SHA" \
              -f status=completed \
              -f conclusion=success \
              -f "output[title]=Snapshot-only commit" \
              -f "output[summary]=Only PNG baselines changed; generated and verified by the update-snapshots job." \
              >/dev/null
          done

      - name: Post snapshot updates comment
        if: ${{ steps.commit.outputs.committed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          pr=$(gh pr list --repo "$OWNER/$REPO" --head "$GITHUB_REF_NAME" \
            --state open --json number,baseRefName \
            --jq 'first | @json' || true)
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            echo "No open PR for $GITHUB_REF_NAME — skipping comment."
            exit 0
          fi
          PR_NUMBER=$(printf '%s' "$pr" | jq -r .number)
          BASE_REF=$(printf '%s' "$pr" | jq -r .baseRefName)
          export PR_NUMBER
          export ASSET_DIR="$PR_NUMBER/$(git rev-parse HEAD)"
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git diff --name-only --diff-filter=AM \
            "origin/$BASE_REF...HEAD" -- '**/__screenshots__/**/*.png' \
            | pnpm exec tsx scripts/pr-screenshot-comment.ts

      - name: Delete stale visual regression comment
        if: ${{ steps.commit.outputs.committed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          MARKER: visual-regressions
          ASSET_DIR: unused
          DELETE_WHEN_EMPTY: "true"
        run: |
          pr=$(gh pr list --repo "$OWNER/$REPO" --head "$GITHUB_REF_NAME" \
            --state open --json number --jq 'first | .number' || true)
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            exit 0
          fi
          PR_NUMBER="$pr" pnpm exec tsx scripts/pr-screenshot-comment.ts </dev/null

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
