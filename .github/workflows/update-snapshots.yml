name: Update snapshot baselines

# Manual escape hatch for accepting an intentional visual change (see
# tests/e2e/README.md). Kept in its own workflow file — a job that's only
# ever meant to run on workflow_dispatch would otherwise show up as a
# permanently "skipped" check on every regular PR/push run of Playwright
# Tests.
#
# Two ways to fire it:
#   - workflow_dispatch (Actions tab, or `gh workflow run update-snapshots.yml
#     --ref <branch>`)
#   - adding the "needs screenshots" label to a PR. The label is removed
#     automatically once this job finishes so it can be re-added later to
#     retrigger.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

# Shared with playwright.yml's group: both workflows can push a baseline
# commit to the same branch, so a stale run's push would otherwise race a
# newer one's. Cancelling the older run shrinks that race window from the
# whole E2E run down to GitHub's cancellation grace period.
#
# concurrency is resolved when the run is created — before the job-level
# `if` below — so this workflow triggers (and would join the shared group)
# on EVERY `labeled` event, not just "needs screenshots". Since playwright.yml
# doesn't re-run on `labeled`, joining the shared group unconditionally would
# let an unrelated label (e.g. "bug") cancel an in-flight E2E run with
# nothing to replace it. Fall back to a self-only group (this run's own id)
# whenever the trigger isn't actually one we act on, so those events can only
# ever conflict with themselves.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || github.event.label.name == 'needs screenshots') && format('snapshot-baselines-{0}', github.event.pull_request.head.ref || github.ref_name) || github.run_id }}
  cancel-in-progress: true

# The E2E environment is set by .github/actions/setup-e2e, shared with
# playwright.yml so regenerated baselines render the same page it checks:
# both serve the app from the image .github/actions/build-app-image builds.

jobs:
  # Reuses the image the commit's own Playwright run built when there is one,
  # and builds it otherwise. That run built it from GitHub's merge commit with
  # the base, the same app the PR's "E2E tests" compares baselines against.
  image:
    name: Build image
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'needs screenshots' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      run-id: ${{ steps.reuse.outputs.run-id }}

    # What `next build` prerenders from; see playwright.yml's image job.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: build
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # The artifact lasts a day, so an older commit's is gone and this builds.
      - name: Look for this commit's image
        id: reuse
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/playwright.yml/runs?head_sha=$SHA&per_page=10" --jq '.workflow_runs[].id'); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?name=app-image" --jq '.artifacts[] | select(.expired | not) | .id' | grep -q .; then
              echo "::notice::Reusing the image Playwright Tests run $run built for ${SHA::7}."
              echo "run-id=$run" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No image for ${SHA::7} yet; building one."

      - uses: actions/checkout@v7
        if: steps.reuse.outputs.run-id == ''
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - uses: ./.github/actions/build-app-image
        if: steps.reuse.outputs.run-id == ''
        with:
          gh-font-read-token: ${{ secrets.GH_FONT_READ }}
          source-commit: ${{ github.event.pull_request.head.sha || github.sha }}

  update-snapshots:
    name: Update snapshot baselines
    needs: image
    # Runs even when the image failed, so the failure shows here and the
    # trigger label is still removed below.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || github.event.label.name == 'needs screenshots') }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # Same pinned image as playwright.yml and scripts/test-e2e-docker.ts —
    # keeps this workflow's regenerated baselines at parity with both.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble

    permissions:
      # The image, when the commit's Playwright run built it.
      actions: read
      contents: write
      pull-requests: write
      checks: write

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Must match TEST_DATABASE_URI in .github/actions/setup-e2e.
          POSTGRES_DB: pragmatic-papers-e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Stop if the image didn't build
        if: needs.image.result != 'success'
        env:
          RESULT: ${{ needs.image.result }}
        run: |
          echo "::error::The Build image job ended with '$RESULT'; there's no image to render baselines from."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Set up E2E
        uses: ./.github/actions/setup-e2e
        with:
          gh-font-read-token: ${{ secrets.GH_FONT_READ }}
          image-run-id: ${{ needs.image.outputs.run-id }}

      # pull_request's $GITHUB_REF_NAME is "<number>/merge", not the branch —
      # resolve the real branch/PR/base once so every later step can rely on
      # it regardless of which trigger fired.
      - name: Resolve PR context
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            {
              echo "branch=$HEAD_REF"
              echo "number=$PR_NUMBER"
              echo "base=$BASE_REF"
            } >> "$GITHUB_OUTPUT"
          else
            pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" \
              --state open --json number,baseRefName --jq 'first | @json' || true)
            {
              echo "branch=$GITHUB_REF_NAME"
              echo "number=$(printf '%s' "$pr" | jq -r '.number // empty')"
              echo "base=$(printf '%s' "$pr" | jq -r '.baseRefName // empty')"
            } >> "$GITHUB_OUTPUT"
          fi

      # E2E_VERIFY_VISUAL folds the flaky-baseline gate into this run: after
      # regenerating, the wrapper re-renders the @visual tests against the same
      # server and fails if a baseline only matches its own first render, so a
      # nondeterministic screenshot can't be accepted into the branch.
      - name: Regenerate changed snapshot baselines
        env:
          E2E_VERIFY_VISUAL: "true"
          # The image's server shares this container's network (scripts/test-e2e.mjs).
          E2E_NETWORK_CONTAINER: ${{ job.container.id }}
        run: pnpm test:e2e -- --update-snapshots=changed --project=chromium

      - name: Commit regenerated snapshots
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/__screenshots__
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "test: update e2e snapshot baselines"
          git push origin "HEAD:$BRANCH"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN start runs that wait for a maintainer's
      # approval, so the snapshot commit would otherwise sit with no results.
      # This job just ran the E2E suite and it passed, so "E2E tests" is
      # reported as passing; the other checks are copied from the commit before
      # with their real results (scripts/snapshot-commit-checks.ts).
      - name: Report CI checks on snapshot commit
        if: ${{ steps.commit.outputs.committed == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: PARENT_SHA=$(git rev-parse HEAD^) HEAD_SHA=$(git rev-parse HEAD) node scripts/snapshot-commit-checks.ts

      - name: Post snapshot updates comment
        if: ${{ steps.commit.outputs.committed == 'true' && steps.pr.outputs.number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BASE_REF: ${{ steps.pr.outputs.base }}
        run: |
          ASSET_DIR="$PR_NUMBER/$(git rev-parse HEAD)"
          export ASSET_DIR
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git diff --name-only --diff-filter=AM \
            "origin/$BASE_REF...HEAD" -- '**/__screenshots__/**/*.png' \
            | pnpm exec tsx scripts/pr-screenshot-comment.ts

      - name: Delete stale visual regression comment
        if: ${{ steps.commit.outputs.committed == 'true' && steps.pr.outputs.number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          MARKER: visual-regressions
          ASSET_DIR: unused
          DELETE_WHEN_EMPTY: "true"
        run: pnpm exec tsx scripts/pr-screenshot-comment.ts </dev/null

      - name: Remove trigger label
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method DELETE \
            "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/needs%20screenshots" \
            || true

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
