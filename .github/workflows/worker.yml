# Deploys staging's Cloudflare Worker (wrangler.jsonc, src/cloudflare/README.md): the public
# site, built by OpenNext, on workers.dev, reading staging's database through Hyperdrive.
# Staging itself keeps running on Coolify, which the Worker sends /admin and /api to.
#
# Runs on every push to `dev`, and by hand. Skips itself until it's set up.
#
# SETUP (Settings → Secrets and variables → Actions)
# --------------------------------------------------
#   - secret   CLOUDFLARE_WORKERS_TOKEN  Workers Scripts, Workers R2 Storage, D1 and
#                                        Hyperdrive, all Edit
#   - secret   CLOUDFLARE_ACCOUNT_ID     shared with the Storybook deploy
#   - secret   STAGING_PAYLOAD_SECRET    staging's PAYLOAD_SECRET: the Worker's own secret,
#                                        and the token for /next/revalidate-all
#   - variable SHOWCASE_STAGING_URL      staging's Coolify URL, which the Worker proxies to
#   - variable WORKER_STAGING_URL        the Worker's own URL, e.g.
#                                        https://pragmatic-papers-staging.<subdomain>.workers.dev
# The Hyperdrive config in wrangler.jsonc must exist; the R2 bucket and D1 database are
# created here if they don't.
name: Staging Worker

on:
  push:
    # TODO(before merge): drop claude/opennext-spike, which deploys the PR to try it first.
    branches: [dev, claude/opennext-spike]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, so an older build never lands last.
concurrency:
  group: worker-staging

jobs:
  deploy:
    name: Deploy staging Worker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      READY: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.STAGING_PAYLOAD_SECRET != '' && vars.SHOWCASE_STAGING_URL != '' && vars.WORKER_STAGING_URL != '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      SERVER_URL: ${{ vars.WORKER_STAGING_URL }}
      ORIGIN_URL: ${{ vars.SHOWCASE_STAGING_URL }}
      # The build prerenders from a throwaway database: nothing reaches staging's while
      # building. /next/revalidate-all throws those pages away once the Worker is up.
      DATABASE_URI: postgres://postgres:postgres@localhost:5432/build
      PAYLOAD_SECRET: build-only-secret
      USE_LOCAL_STORAGE: "true"

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: build
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Skip until set up
        if: env.READY != 'true'
        run: echo "::notice::The staging Worker isn't set up yet (see the top of .github/workflows/worker.yml); skipping."

      - uses: actions/checkout@v7
        if: env.READY == 'true'

      - name: Set up Node.js environment
        if: env.READY == 'true'
        uses: ./.github/actions/setup-project
        with:
          node-version: "24.x"
          gh-font-read-token: ${{ secrets.GH_FONT_READ }}

      - name: Migrate the build database
        if: env.READY == 'true'
        run: pnpm payload migrate

      - name: Build the Worker
        if: env.READY == 'true'
        run: pnpm build:worker

      # The deploy fills both before `wrangler deploy` could create them, so they're made here
      # the first time, by the names in wrangler.jsonc.
      - name: Create the R2 bucket and D1 database if they're missing
        if: env.READY == 'true'
        run: |
          # The names in wrangler.jsonc.
          bucket=pragmatic-papers-staging-cache
          database=pragmatic-papers-staging-tags
          pnpm exec wrangler r2 bucket info "$bucket" >/dev/null 2>&1 || pnpm exec wrangler r2 bucket create "$bucket"
          pnpm exec wrangler d1 info "$database" >/dev/null 2>&1 || pnpm exec wrangler d1 create "$database"

      # Uploads the prerendered pages to R2, creates the D1 table if it's missing, then
      # `wrangler deploy`s with the runtime variables and Payload's secret.
      - name: Deploy
        if: env.READY == 'true'
        env:
          STAGING_PAYLOAD_SECRET: ${{ secrets.STAGING_PAYLOAD_SECRET }}
        run: |
          secrets="$RUNNER_TEMP/worker-secrets.json"
          jq -n --arg secret "$STAGING_PAYLOAD_SECRET" '{PAYLOAD_SECRET: $secret}' > "$secrets"
          pnpm exec opennextjs-cloudflare deploy -- \
            --secrets-file "$secrets" \
            --var "SERVER_URL:$SERVER_URL" \
            --var "ORIGIN_URL:$ORIGIN_URL"
          rm "$secrets"

      - name: Re-render what the build prerendered
        if: env.READY == 'true'
        env:
          STAGING_PAYLOAD_SECRET: ${{ secrets.STAGING_PAYLOAD_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors \
            --request POST --header "Authorization: Bearer $STAGING_PAYLOAD_SECRET" \
            "$SERVER_URL/next/revalidate-all"

      - name: Check the home page answers
        if: env.READY == 'true'
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --retry 3 --retry-all-errors "$SERVER_URL/")
          echo "GET / → $status"
          test "$status" = 200
