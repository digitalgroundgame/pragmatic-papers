services:
  postgres-pragmatic:
    container_name: postgres-pragmatic
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before running docker compose}
      POSTGRES_DB: ${POSTGRES_DB:-pragmatic-papers}
    ports:
      - "9000:5432"
    volumes:
      - pragmatic_papers_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pragmatic_papers_postgres_data:
    name: pragmatic_papers_postgres_data
