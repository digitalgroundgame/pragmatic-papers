# pnpm workspace configuration for pragmatic-papers
# Configuration settings for dependencies (overrides, allowBuilds) are managed here for pnpm 10+.

overrides:
  "@types/react": "19.2.14"
  "@types/react-dom": "19.2.3"

allowBuilds:
  canvas: true
  core-js-pure: true
  esbuild: true
  msw: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
